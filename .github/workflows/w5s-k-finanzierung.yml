name: W5s-k – Speditionskapital und Frachtengate
on:
  push:
    branches:
      - feature/w5s-k-finanzierung-und-frachtengate-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-k-finanzstatus.test.mjs
      - .github/workflows/w5s-k-finanzierung.yml
jobs:
  kapital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-k-finanzstatus.test.mjs
