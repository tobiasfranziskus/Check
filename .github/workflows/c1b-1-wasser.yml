name: C1b-1 – exaktes isoliertes C-Wasserprofil
on:
  pull_request:
    paths:
      - index.html
      - tools/research/c1b-1-wasser.mjs
      - tests/c1b-1-exaktes-c-wasser.test.mjs
      - tests/c1b-2-industrie-vorstufe.test.mjs
      - tests/c1c-1-lohnrueckfluss.test.mjs
      - tests/c1c-2-bauteil-produktion.test.mjs
      - tests/c1c-3-silizium-lager.test.mjs
      - tests/c1d-1-meridian-fracht.test.mjs
      - tests/c1d-2-externe-abnahme.test.mjs
      - tests/c1d-3-mehrchargen-fracht.test.mjs
      - tests/c1d-4-finanzierter-vierervertrag.test.mjs
      - tests/c1d-5-bauteil-eigentum.test.mjs
      - tests/c1d-6-konzernvollkosten.test.mjs
      - tests/c1d-7-folgebuchungen.test.mjs
      - tests/c1d-8-zweiter-modulzyklus.test.mjs
      - tests/c1d-8b-zweiter-export.test.mjs
      - tests/c1d-9-kapitalreichweite.test.mjs
      - tests/c1d-10-stationsmodulbedarf.test.mjs
      - tools/research/c1d-9-kapitalreichweite.mjs
      - tools/research/c1d-6-vollkosten.mjs
      - .github/workflows/c1b-1-wasser.yml
permissions:
  contents: read
jobs:
  water-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Negativtests, 30/90 Tage, gepaarte C1a-Kontrolle, Replay und Audits
        env:
          C1B1_REPORT: c1b1-results.json
        run: node tests/c1b-1-exaktes-c-wasser.test.mjs
      - name: C1b-2 bezahlte Industrievorstufe und belegte Exportlücke
        env:
          C1B2_REPORT: c1b2-results.json
        run: node tests/c1b-2-industrie-vorstufe.test.mjs
      - name: C1c-1 bezahlte Industrie- und Transportloehne
        run: node tests/c1c-1-lohnrueckfluss.test.mjs
      - name: C1c-2 echte Bauteilproduktion aus bezahlten Rohstoffen
        run: node tests/c1c-2-bauteil-produktion.test.mjs
      - name: C1c-3 Silizium 10 Minuten und bezahltes Lagermodul
        run: node tests/c1c-3-silizium-lager.test.mjs
      - name: C1d-1 echte vorfinanzierte Meridian-Lieferung ohne Emission
        run: node tests/c1d-1-meridian-fracht.test.mjs
      - name: C1d-2 einmalige externe Abnahme und begrenzte Forschungsrechte
        run: node tests/c1d-2-externe-abnahme.test.mjs
      - name: C1d-3 bezahlte Mehrchargen und gebündelte Fracht
        run: node tests/c1d-3-mehrchargen-fracht.test.mjs
      - name: C1d-4 kaufvertraglich bezahlte Viererfracht und reale Abnahme
        run: node tests/c1d-4-finanzierter-vierervertrag.test.mjs
      - name: C1d-5 echte Bauteiltitel, Verwahrung, Direktverarbeitung und Endabnahme
        run: node tests/c1d-5-bauteil-eigentum.test.mjs
      - name: C1d-6 unabhaengige Eigentums-, Kapital- und Firmenkontenbilanz
        run: node tests/c1d-6-konzernvollkosten.test.mjs
      - name: C1d-7 historische Vertragsbelege bleiben bei echten Folgegeschaeften auditiert
        run: node tests/c1d-7-folgebuchungen.test.mjs
      - name: C1d-8 zweite bezahlte Viererproduktion und Titellose ohne Zweitexport
        run: node tests/c1d-8-zweiter-modulzyklus.test.mjs
      - name: C1d-8b zweite echte 1720-ISK-Abnahme und voll vorfinanzierter 240-Minuten-Rueckflug
        run: node tests/c1d-8b-zweiter-export.test.mjs
      - name: C1d-9 zwei Produktionsperioden Kapitalreichweite und Endkauf-Gate auditieren
        run: node tests/c1d-9-kapitalreichweite.test.mjs
      - name: C1d-10 echte Nadir-Nachfrage und bezahlter Kapazitaetseinbau
        run: node tests/c1d-10-stationsmodulbedarf.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: c1b1-water-measurements
          path: |
            c1b1-results.json
            c1b2-results.json
          if-no-files-found: error
