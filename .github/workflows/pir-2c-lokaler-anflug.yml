name: PIR-2c Lokaler Anflug
on:
  pull_request:
    paths:
      - 'tests/pir-2c-lokaler-anflug.test.mjs'
      - '.github/workflows/pir-2c-lokaler-anflug.yml'
jobs:
  flight-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pir-2c-lokaler-anflug.test.mjs
