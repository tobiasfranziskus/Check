name: M4 U9c – post-settlement follow-up research
on:
  pull_request:
    branches:
      - research/m4-u9b-teilabrechnung-20261123
    paths:
      - 'tools/m4-management-szenarien.cjs'
      - 'tools/m4-u9c-folgeauftraege.cjs'
      - 'tests/m4-u9c-folgeauftraege-research.cjs'
      - '.github/workflows/m4-u9c-folgeauftraege.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --check tools/m4-u9c-folgeauftraege.cjs
          node --test tests/m4-u9c-folgeauftraege-research.cjs
