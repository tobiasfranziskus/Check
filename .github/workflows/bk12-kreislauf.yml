name: Aphros Void – B-K12 Kreislaufanalyse (kein Produktkandidat)
on:
  pull_request:
    paths:
      - 'tests/bk12-kreislauf.test.mjs'
      - 'tests/lib/bk12-analyse.mjs'
      - 'tests/fixtures/bk11h-r15-core-snapshot.txt'
      - '.github/workflows/bk12-kreislauf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kreislauf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MAIN-Kontrolle, Einzelcharge, drei isolierte Gegenarme und Spielerkrisen
        env:
          BK12_OUTPUT_DIRECTORY: /tmp/bk12-output
        run: node --test --experimental-test-isolation=none tests/bk12-kreislauf.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk12-konten-und-buchungsjournale
          path: /tmp/bk12-output
          retention-days: 14
