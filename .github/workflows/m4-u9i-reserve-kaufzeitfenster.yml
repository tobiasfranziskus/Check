name: M4 U9i – reserve purchase windows
on:
  pull_request:
    branches:
      - research/m4-u9h-frachterreserve-20261123
    paths:
      - 'tools/m4-u9i-reserve-kaufzeitfenster.cjs'
      - 'tests/m4-u9i-reserve-kaufzeitfenster-research.cjs'
      - '.github/workflows/m4-u9i-reserve-kaufzeitfenster.yml'
permissions:
  contents: read
jobs:
  paired-90:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --check tools/m4-u9i-reserve-kaufzeitfenster.cjs
          node --test tests/m4-u9i-reserve-kaufzeitfenster-research.cjs
