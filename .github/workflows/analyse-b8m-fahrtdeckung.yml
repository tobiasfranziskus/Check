name: "[ANALYSE] B8m NPC3 gedeckte Reiseentscheidungen statt unbezahlter Leerflüge"
on:
  push:
    branches: [analyse/b8m-unfinanzierte-leerfahrten-20261101]
    paths:
      - 'tools/analyse-b8m-fahrtdeckung.mjs'
      - '.github/workflows/analyse-b8m-leerfahrten.yml'
      - 'index.html'
  pull_request:
    paths:
      - 'tools/analyse-b8m-fahrtdeckung.mjs'
      - '.github/workflows/analyse-b8m-leerfahrten.yml'
      - 'index.html'
jobs:
  b8m:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Node regressions
        run: node --test tests/*.test.mjs
      - name: 8 worlds x 90 days with independent replay, cash/goods audit and saves
        run: node tools/analyse-b8m-fahrtdeckung.mjs --out="$RUNNER_TEMP/b8m"
      - name: Audit reports
        uses: actions/upload-artifact@v4
        with:
          name: b8m-risk-economics
          path: ${{ runner.temp }}/b8m/b8m-results.json
          if-no-files-found: error
