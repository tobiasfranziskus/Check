name: Aphros Void – JavaScript-Regressionsprüfung

on:
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-regression.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-regression.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teste Spielstart, Handel und Simulationsdeterminismus
        run: node --test tests/*.test.mjs
