name: M4 U9h – real fleet reserve
on:
  pull_request:
    branches:
      - research/m4-u9g-vollcharge-20261123
    paths:
      - 'tools/m4-*.cjs'
      - 'tests/m4-u9h-frachterreserve-research.cjs'
      - '.github/workflows/m4-u9h-frachterreserve.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git rev-parse HEAD
          node --check tools/m4-u9h-frachterreserve.cjs
          node --test tests/m4-u9h-frachterreserve-research.cjs
  horizon:
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [control, vorrat, reserve]
        days: [365, 730]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/m4-u9h-frachterreserve.cjs ${{ matrix.variant }} ${{ matrix.days }} 60 42 1
