name: W5s-t – unabhängiger Spediteur und Nachfolge-Audits
on:
  push:
    branches:
      - feature/w5s-t-unabhaengiger-spediteur-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-t-unabhaengige-spedition.test.mjs
      - .github/workflows/w5s-t-spedition.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-t-unabhaengige-spedition.test.mjs
