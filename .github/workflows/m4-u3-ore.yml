name: "M4-U3 – wirklich bezahlter eigener Erzauftrag (Node22 + Touch)"
on:
  pull_request:
    paths:
      - 'prototypes/welt/welt-kern.js'
      - 'prototypes/verbund/konzern-session.js'
      - 'prototypes/spiel/**'
      - 'tests/m4-u3-house-ore.test.mjs'
      - 'tests/m4-u3-ore-browser.cjs'
      - '.github/workflows/m4-u3-ore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ore-original-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Originalfinanzierung, Seed42, Geld, Waren, Save, Negativ- und Replay-Fälle"
        run: node --test tests/m4-u3-house-ore.test.mjs
  ore-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Playwright nur im CI installieren"
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/m4-playwright" playwright@1.62.0
          node "$RUNNER_TEMP/m4-playwright/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: "Öffentliches Root → eigener Erzminer → echte W1-Kaufquittung, Reload und vier Touchgrößen"
        run: node tests/m4-u3-ore-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/m4-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
