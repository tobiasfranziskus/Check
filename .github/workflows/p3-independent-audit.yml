name: P3 independent research audit
on:
  pull_request:
    branches: ['research/p3-fair-ferry-window-20261118']
    paths:
      - 'tests/p3-independent-*'
      - '.github/workflows/p3-independent-audit.yml'
      - 'docs/P3_UNABHAENGIGER_AUDIT.md'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/p3-independent-audit.test.mjs tests/p3-minute-capacity.test.mjs tests/p3-fair-ferry-research.test.mjs
      - run: node tests/p3-independent-soak.cjs seeds 1
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { scenarios: 'S01 S02 S03 S04', days: 90 }
          - { scenarios: 'S05 S06 S07 S08', days: 90 }
          - { scenarios: 'S09 S10 S11 S12 S13', days: 90 }
          - { scenarios: 'S02', days: 730 }
    name: ${{ matrix.days }} days – ${{ matrix.scenarios }}
    env:
      SCENARIOS: ${{ matrix.scenarios }}
      DAYS: ${{ matrix.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          read -r -a scenarios <<< "$SCENARIOS"
          for scenario in "${scenarios[@]}"; do
            node tests/p3-independent-soak.cjs "$scenario" "$DAYS" || exit "$?"
          done
