name: Aphros Void – JavaScript-Regressionsprüfung

on:
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-regression.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-regression.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teste Spielstart, Handel und Simulationsdeterminismus
        run: node --test tests/*.test.mjs

  sicherheitsgeografie-vergleich:
    # Der historische Paarvergleich gilt für den Folge-PR auf PR #19.
    if: github.event_name == 'pull_request' && github.base_ref == 'feat/sicherheitszonen'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 13 Seeds über 90 Tage mit stündlichen Audits und Wiederholung
        run: node tools/sicherheitsgeografie-simulation.mjs

  wirtschaft-v11-referenz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Referenz v11 13 Seeds x 90 Tage
        run: node tools/geography-reference-v11.mjs

  wirtschaft-geografie-drei-varianten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 13 Seeds x 90 Tage Basis Tor Tor-plus-Nadir
        run: node tools/geography-three-way.mjs

  wirtschaft-npc-liquiditaet-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NPC1/NPC2-Kapitalbindung, Verkäufe und Kostenlücken in 13 Seeds
        run: node tools/npc-liquidity-diagnosis.mjs

  wirtschaft-npc-kapitalobergrenze-szenarien:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 13 Seeds 90 Tage je Kapitalobergrenze 6000 12000 unbegrenzt
        run: node tools/npc-cap-scenarios.mjs
