name: W6 independent investment replay
on:
  pull_request:
    branches:
      - research/w6-geldumlauf-wasser-20261126
    paths:
      - 'tools/w6-investition-audit.cjs'
      - '.github/workflows/w6-investition-audit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arm: [kontrolle, frachter, miner]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify published 730 day investment results
        run: |
          node --check tools/w6-investition-audit.cjs
          node tools/w6-investition-audit.cjs ${{ matrix.arm }} report.json
      - uses: actions/upload-artifact@v4
        with:
          name: w6-investition-audit-${{ matrix.arm }}
          path: report.json
          if-no-files-found: error
