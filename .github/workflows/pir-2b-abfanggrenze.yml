name: PIR-2b Abfanggrenze
on:
  pull_request:
    paths:
      - 'tests/pir-2b-abfanggrenze.test.mjs'
      - '.github/workflows/pir-2b-abfanggrenze.yml'
jobs:
  original-flight-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pir-2a-zielbewertung.test.mjs tests/pir-2b-abfanggrenze.test.mjs
