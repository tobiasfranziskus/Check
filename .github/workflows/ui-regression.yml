name: Aphros Void – JavaScript-Regressionsprüfung

on:
  pull_request:
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-regression.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/ui-regression.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teste Spielstart, Handel und Simulationsdeterminismus
        run: node --test tests/*.test.mjs

  sicherheitsgeografie-vergleich:
    # Der historische Paarvergleich gilt für den Folge-PR auf PR #19.
    if: github.event_name == 'pull_request' && github.base_ref == 'feat/sicherheitszonen'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 13 Seeds über 90 Tage mit stündlichen Audits und Wiederholung
        run: node tools/sicherheitsgeografie-simulation.mjs

  wirtschaft-v11-referenz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Referenz v11 13 Seeds x 90 Tage
        run: node tools/geography-reference-v11.mjs

  wirtschaft-geografie-drei-varianten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 13 Seeds x 90 Tage Basis Tor Tor-plus-Nadir
        run: node tools/geography-three-way.mjs

  wirtschaft-v10-referenz:
    # Die v10-Fixwerte sind ausschließlich für die Sicherheitswelt von PR #19 gültig.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V10-Referenzvergleich (13 Seeds x 90 Tage)
        shell: bash
        run: |
          if grep -q 'schema: 8, rulesVersion: 10,' index.html; then
            node tools/freeflight-simulation.mjs
          else
            echo 'V10-Referenzvergleich für andere Regelversion übersprungen; eine eigene Referenz ist erforderlich.'
          fi

  wirtschaft-v12-versorgungsfreigabe:
    # Historische Originalquelle und unveränderte Fixture nicht gegen Regel 13 umetikettieren.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historische Regel 12 am festgehaltenen Main-Commit prüfen
        run: |
          git fetch origin 906b7978d388e9af960443a2b7f4835b1d2a15c0
          mkdir -p "$RUNNER_TEMP/v12-original"
          git archive 906b7978d388e9af960443a2b7f4835b1d2a15c0 | tar -x -C "$RUNNER_TEMP/v12-original"
          (cd "$RUNNER_TEMP/v12-original" && node tools/priority-v12-reference.mjs)

  wirtschaft-v13-kostenkorrektur:
    # Neuer Regel-13-Nachweis: unveränderte historische v12-Goldenwerte sind Vergleich, keine neue Fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historischen Regel-13-Wirtschaftslauf auf dem Originalcommit reproduzieren
        run: |
          git fetch origin e0c27a3762d9d6e75d8bcc30ed47621eff2f152b
          mkdir -p "$RUNNER_TEMP/v13-original"
          git archive e0c27a3762d9d6e75d8bcc30ed47621eff2f152b | tar -x -C "$RUNNER_TEMP/v13-original"
          (cd "$RUNNER_TEMP/v13-original" && node tools/b5a-kostenvergleich.mjs "$RUNNER_TEMP/b5a-v13-13seeds.json")
      - uses: actions/upload-artifact@v4
        with:
          name: b5a-v13-wirtschaftspruefung
          path: ${{ runner.temp }}/b5a-v13-13seeds.json

  wirtschaft-v14-sollflottenzuordnung:
    # B5b: Neue Regeln an historischen, unveränderten 13-Seed-v12-Wirtschaftskennzahlen messen.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produktbasis von B5b festhalten
        run: git fetch origin e0c27a3762d9d6e75d8bcc30ed47621eff2f152b
      - name: 13 Seeds x 90 Tage Regel 14 mit unabhängigen Geld-/Warenaudits, Replays und Save/Load
        run: node tools/b5b-wirtschaft-v14.mjs "$RUNNER_TEMP/b5b-v14-13seeds.json"
      - uses: actions/upload-artifact@v4
        with:
          name: b5b-v14-wirtschaftspruefung
          path: ${{ runner.temp }}/b5b-v14-13seeds.json
