name: W6 S02 60 percent long horizon
on:
  pull_request:
    branches:
      - research/w6-s02-ersatzvorlauf-matrix-20261126
    paths:
      - 'tools/w6-s02-60-langzeit.cjs'
      - '.github/workflows/w6-s02-60-langzeit.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        days: [365, 730]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extend unchanged 90-day candidate and replay
        run: |
          node --check tools/w6-s02-60-langzeit.cjs
          node tools/w6-s02-60-langzeit.cjs ${{ matrix.days }} w6-s02-60-langzeit.json
      - uses: actions/upload-artifact@v4
        with:
          name: w6-s02-60-langzeit-${{ matrix.days }}
          path: w6-s02-60-langzeit.json
          if-no-files-found: error
