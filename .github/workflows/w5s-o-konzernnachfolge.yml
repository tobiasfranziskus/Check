name: W5s-o – Konzernnachfolge und reale Eigentumsbücher
on:
  push:
    branches:
      - feature/w5s-o-finanzierte-konzernuebernahme-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-o-*.test.mjs
      - .github/workflows/w5s-o-konzernnachfolge.yml
jobs:
  successor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-o-*.test.mjs
