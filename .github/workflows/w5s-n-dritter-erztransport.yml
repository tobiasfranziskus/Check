name: W5s-n – Dritter Erztransport & finanziertes Nachfrage-Gate
on:
  push:
    branches:
      - feature/w5s-n-dritter-erztransport-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-n-dritter-erztransport.test.mjs
      - .github/workflows/w5s-n-dritter-erztransport.yml
jobs:
  dritter-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-n-dritter-erztransport.test.mjs tests/w5s-n-ruecklagen.test.mjs
