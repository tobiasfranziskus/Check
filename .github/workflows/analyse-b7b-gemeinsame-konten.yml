name: Aphros Void B7b - gemeinsame Schiffs-/Auftragskonten
on:
  pull_request:
    paths:
      - tools/analyse-b7b-gemeinsame-konten.mjs
      - .github/workflows/analyse-b7b-gemeinsame-konten.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b7b-seed42-10days:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historische B1-Befehle fixieren
        run: |
          git fetch origin 6855d76bb374dd777a1b7e30ea52c9a6eca36399
          mkdir -p "$RUNNER_TEMP/b7b-b1" "$RUNNER_TEMP/b7b-out"
          git archive 6855d76bb374dd777a1b7e30ea52c9a6eca36399 | tar -x -C "$RUNNER_TEMP/b7b-b1"
      - name: Reine Regel14 Kontrolle Tag1-10
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=control --days=10 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: B7b Einziger Finanzierungsversuch inklusive Spielerbefehl
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --days=10 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: Langlauf dieselbe unveraenderte Kontrolle 90 Tage
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=control --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: Langlauf dieselbe gemeinsame Walletregel 90 Tage
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: Vergleich ueber unveraenderte Kontrolle und Geldquellen
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const d=process.env.RUNNER_TEMP+"/b7b-out/";
            const read=(mode,days)=>JSON.parse(fs.readFileSync(d+"b7b-handel-flotte-42-"+mode+"-"+days+"d.json"));
            for(const days of [10,90]){
              const c=read("control",days),w=read("wallet",days);
              for(const x of [c,w]){
                assert.equal(x.days,days);assert.equal(x.hours,days*24);assert.equal(x.roundtrips,days===10?8:14);
                assert.equal(x.commands,7);assert.equal(x.daily.length,days);assert.equal(x.h1.paid,0);
                assert.equal(x.sourceSha256,"035fe8b486ff2d515ca6379ad682b4b15d89d5d051866e287425ed425e1cbfc9");
                assert.equal(55000+x.final.minted-x.final.burned,50000,"Weltgeld-Summe muss alle vorhandenen Schiffs-/Konzernkassen enthalten");
              }
              assert.equal(c.variantSha256,c.sourceSha256);
              assert.notEqual(w.variantSha256,w.sourceSha256);
              assert.equal(w.wallet.manualFund.owner,"house");
              assert.equal(w.wallet.manualFund.betrag,1000);
              assert.equal(w.wallet.manualFundExecuted,true);
              assert.equal(w.manualFlightProof.rejectedBeforeFunding,true);
              assert.equal(w.manualFlightProof.departedAfterFunding,true);
              assert(w.manualFlightProof.fare>0);
              if(days===10)assert.equal(c.final.hash,"84f1a88d2701ff2a","gepinntes B7a/H1-C3-Kontrollhash");
              if(days===90){
                assert.equal(c.daily[9].hash,read("control",10).final.hash,"Kontrolle Tag10 identisch");
                assert.equal(w.daily[9].hash,read("wallet",10).final.hash,"Wallet Tag10 identisch");
              }
              console.log("B7B_CAUSAL_COMPARISON",JSON.stringify({
                days,
                control:{cash:c.final.npc,shortage:c.final.shortage,sales:c.traderSales,unpaid:c.unpaid,paid:c.paid,due:c.due,consumption:c.consumerAudit.aggregate,playerCash:c.final.playerCash,minted:c.final.minted,burned:c.final.burned,alderaParts:c.final.partsAldera},
                sharedWallet:{cash:w.final.npc,shortage:w.final.shortage,sales:w.traderSales,unpaid:w.unpaid,paid:w.paid,due:w.due,consumption:w.consumerAudit.aggregate,playerCash:w.final.playerCash,minted:w.final.minted,burned:w.final.burned,walletCash:w.final.walletCash,walletCount:w.final.walletCount,alderaParts:w.final.partsAldera},
              }));
            }
          '
      - name: Read-only Ursache Tag 10 bis 15 gegen alte 90-Tage-Hashes verifizieren
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            for(const mode of ["control","wallet"]){
              const x=JSON.parse(fs.readFileSync(dir+"b7b-handel-flotte-42-"+mode+"-90d.json"));
              const diagnostics=x.b7cDiagnostics;
              assert.equal(diagnostics.length,145,"Tage9-15 je Stunde einschliesslich beider Randpunkte");
              const originalFinal=mode==="control"?"784047684dfe5c56":"82f11deee8c7f566";
              assert.equal(x.final.hash,originalFinal,"reines Beobachten aendert keinen B7b-Zustand");
              for(const day of [9,10,11,12,13,14,15]){
                const a=diagnostics.find(s=>s.tick===day*1440);
                assert(a,"Tagessnapshot muss existieren");
                const baseline=x.daily[day-1];
                assert.equal(a.cash.player,baseline.playerCash);
                assert.equal(a.cash.npc1,baseline.npc.npc1.cash);
                assert.equal(a.cash.npc2,baseline.npc.npc2.cash);
                assert.equal(a.stations.reduce((n,s)=>n+s.completed,0),baseline.recipes);
                const consumers=a.stations.filter(s=>s.consumer.some(x=>x.ware==="nahrung"));
                const stationsAffordable=consumers.filter(s=>s.consumer.some(v=>v.canBuyOne)).length;
                const statuses=a.stations.flatMap(s=>s.recipes).reduce((o,v)=>(o[v.status]=(o[v.status]||0)+1,o),{});
                const lastConsumers=x.consumerAudit.days[day-1].consumed;
                console.log("B7C_DAILY_CAUSE",JSON.stringify({mode,day,recipes:baseline.recipes,statuses,stock:a.totals,npc:a.cash,consumer:lastConsumers,stationsAffordable,stations:a.stations.map(s=>({id:s.id,cash:s.cash,stock:{nahrung:s.inventory.nahrung||0,medikamente:s.inventory.medikamente||0,bauteil:s.inventory.bauteil||0,erz:s.inventory.erz||0,silizium:s.inventory.silizium||0,material:s.inventory.material||0},blocked:s.recipes.filter(r=>r.status!=="running").map(r=>({recipe:r.recipe,reason:r.status,missing:r.missing,full:r.full}))})),ships:a.ships.filter(s=>s.owner==="npc1"||s.owner==="npc2")}));
              }
              if(mode==="wallet"){
                assert.equal(x.daily[14].recipes,x.daily[12].recipes,"nach Tag12 keine neue Fertigung im unveraenderten B7b-Lauf");
                assert.equal(x.consumerAudit.days[14].consumed.nahrung,0,"Tag15 Nullverbrauch");
                assert.equal(x.consumerAudit.days[14].consumed.medikamente,0);
              }
            }
          '
      - name: B7d reale Handelsangebote und Ursache der Marktsperre ohne Kerneingriff
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            const read=(mode,days)=>JSON.parse(fs.readFileSync(dir+"b7b-handel-flotte-42-"+mode+"-"+days+"d.json"));
            for(const mode of ["control","wallet"])for(const days of [10,90]){
              const x=read(mode,days),rows=x.b7dDiagnostics;
              assert.equal(rows.length,days===10?1:4,"Tag10 bzw 10,11,12,15");
              assert.deepEqual(rows.map(x=>x.day),days===10?[10]:[10,11,12,15]);
              for(const row of rows){
                assert.equal(row.routes.length,16,"16 exakt definierte Marktpaare");
                assert.equal(row.counts.candidateQuotes,7*6*3,"alle 126 gerichteten Paare fuer 3 Waren");
                assert(row.counts.prefundedWithShipAtSource<=row.counts.withEmptyShipAtSource);
                assert(row.counts.withEmptyShipAtSource<=row.counts.afterWorkPositive);
                assert(row.counts.afterWorkPositive<=row.counts.nominalPositive);
                for(const q of row.routes){
                  assert(q.qty>=0&&q.qty<=q.buyerCanTake);
                  assert(q.qty<=q.available);
                  assert(q.workCost>0&&q.fundNeed>=q.workCost);
                  if(q.financeable.length)assert(q.qty>0 && q.emptyDockedSource.length>0);
                }
                const named=row.routes.filter(q=>
                  q.origin==="st_meridian"&&q.ware==="nahrung"&&["st_aldera","st_cyris","st_nadir","st_orion"].includes(q.target) ||
                  q.ware==="silizium"&&q.target==="st_aldera");
                console.log("B7D_VERIFIED_QUOTE",JSON.stringify({
                  mode,day:row.day,count:row.counts,focus:named,
                  top:row.top.slice(0,5)
                }));
              }
              if(days===90)assert.deepEqual(rows[0],read(mode,10).b7dDiagnostics[0],"stabile Tag10-Marktangebote in 10-/90-Tageswelt");
              if(days===90)assert.equal(x.final.hash, mode==="control"? "784047684dfe5c56":"82f11deee8c7f566",
                "read-only Preisberechnung darf deterministischen Tag90-Endhash nicht aendern");
              else if(mode==="control")assert.equal(x.final.hash,"84f1a88d2701ff2a","gepinntes Tag10-Kontrollergebnis");
            }
          '
      - name: 67 Standardtests
        run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7b-shared-accounts-seed42
          path: ${{ runner.temp }}/b7b-out/*.json
