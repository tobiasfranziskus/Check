name: W5s-j – echter Nadir-Starterminer und Ersatz
on:
  push:
    branches:
      - feature/w5s-j-nadir-starterminer-echt-verkaufen-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-j-nadir-starterminer.test.mjs
      - .github/workflows/w5s-j-starterminer.yml
jobs:
  starterminer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-j-nadir-starterminer.test.mjs
