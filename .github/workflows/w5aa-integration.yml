name: W5aa – Rule18 original W4 refinery in shared game hub
on:
  pull_request:
    paths:
      - 'prototypes/w5aa/**'
      - 'prototypes/w5y/extension.js'
      - 'prototypes/w5w/app.js'
      - 'prototypes/legacy-hub/core-adapter.js'
      - 'tests/w5aa-original-w4-refinery.test.mjs'
      - 'tests/w5aa-w4-90d-matrix.test.mjs'
      - 'tests/w5aa-touch.py'
      - '.github/workflows/w5aa-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w4-original-core-and-all-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original W4 freight, production, 13x90 days, finances plus all JS regression
        run: node --test tests/*.test.mjs
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: 'Touch: original W3 transport and paid W4 refinery, four viewports'
        run: python tests/w5aa-touch.py
        env:
          CHROMIUM_PATH: playwright-managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5aa-touch-evidence
          path: /tmp/w5aa-*.png
