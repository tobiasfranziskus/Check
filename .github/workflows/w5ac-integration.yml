name: W5ac – Rule191 fully paid W5 ferry and real new-hull freight
on:
  pull_request:
    paths:
      - 'prototypes/w5ac/**'
      - 'prototypes/w5ab/extension.js'
      - 'prototypes/w5aa/extension.js'
      - 'prototypes/w5y/extension.js'
      - 'prototypes/w5w/app.js'
      - 'prototypes/legacy-hub/core-adapter.js'
      - 'tests/w5ac-frachterueberfuehrung.test.mjs'
      - 'tests/w5ac-regel191-90d.test.mjs'
      - 'tests/w5ac-touch.py'
      - '.github/workflows/w5ac-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rule191-core-and-all-js-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original W0-W5 plus isolated Rule191 ferry, fully paid subsequent W3, save/provenance, 13x90
        run: node --test tests/*.test.mjs
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Four responsive touch viewports, real 60 ISK flight and subsequent paid freight
        run: python tests/w5ac-touch.py
        env:
          CHROMIUM_PATH: playwright-managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5ac-touch-evidence
          path: /tmp/w5ac-*.png
