name: PIR-4a – Reale Vergleichsproduktion
on:
  pull_request:
    paths:
      - 'tests/pir-4a-leichter-jaeger-realproduktion.test.mjs'
      - '.github/workflows/pir-4a-leichter-jaeger-realproduktion.yml'
      - 'prototypes/welt/**'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pir-4a-leichter-jaeger-realproduktion.test.mjs
