name: "Kanonische Welt K1 – Node22, Wirtschaftsszenarien und Browser (Forschung)"
on:
  pull_request:
    paths:
      - 'prototypes/welt/**'
      - 'prototypes/flug2d/flug-kern.js'
      - 'prototypes/flug2d/grafik.js'
      - 'prototypes/w5ac/rule191-w5-ferry-core.js'
      - 'prototypes/welt/rule200-k7-industry-core.js'
      - 'tests/k7-core-isolation.test.mjs'
      - 'tools/welt-szenarien.mjs'
      - 'tools/k3-frachter-diagnose.mjs'
      - 'tools/k5-terminal-diagnose.mjs'
      - 'tests/k5-terminal-diagnose.test.mjs'
      - 'tools/k6-eisdisposition.mjs'
      - 'tests/k6-eisdisposition.test.mjs'
      - 'tools/k7-industrieerz-gate.mjs'
      - 'tests/k7-industrieerz-gate.test.mjs'
      - 'tests/k7-industrieerz-vertrag.test.mjs'
      - 'tests/k7-vertragsabwehr.test.mjs'
      - 'tests/k7-industrie-13x90.test.mjs'
      - 'tests/k8-zweiter-industrieerz-vertrag.test.mjs'
      - 'tests/k9-zweite-w4-w5-kette.test.mjs'
      - 'tests/k10-dritter-industriezyklus.test.mjs'
      - 'tests/k11-realer-frachterbedarf.test.mjs'
      - 'tests/k12-eisfracht-geldkreislauf.test.mjs'
      - 'tests/k13-zwei-echte-finanzbruecken.test.mjs'
      - 'tools/k13-finanzbruecke.mjs'
      - 'tools/k11-k10-endstand.mjs'
      - 'prototypes/w5ac/rule191-w5-ferry-core.js'
      - 'prototypes/welt/welt-kern.js'
      - 'tools/k4-ore-allocation.mjs'
      - 'tests/k4-ore-allocation.test.mjs'
      - 'tools/referenzmodell-c.mjs'
      - 'tests/welt-*'
      - 'tests/k13-f6-*'
      - 'tests/f8-jaeger-*'
      - 'tests/f8d-*'
      - 'tests/f8e-*'
      - 'prototypes/f8-jaeger/**'
      - 'tests/referenzmodell-c.test.mjs'
      - 'index.html'
      - 'aphros-void.html'
      - '.github/workflows/welt-k1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kern-wirtschaft-speicher-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K1-Kern: Ortsbindung, Replay, Save/Load, Manipulationsabwehr"
        run: node --test tests/welt-kern.test.mjs
      - name: "K1-Spielstand: Umschlag, Plätze, Sicherungen, Import, Regel195-Übernahme"
        run: node --test tests/welt-speicher.test.mjs
      - name: "Referenzmodell C nachgerechnet und Abweichungen der ausgeführten Welt"
        run: node --test tests/referenzmodell-c.test.mjs
      - name: "K2: finanzierter Minerbau, Rückfracht, Ersatz, Save/Load"
        run: node --test tests/welt-k2-miner.test.mjs
      - name: "K2-QA: Zwischenstände, Treuhand, Manipulationsabwehr, Replay"
        run: node --test tests/welt-k2-zwischenzustand.test.mjs
      - name: "K3: unabhängige Frachterkette, Zwischenstände, Negativbeweis"
        run: |
          node --test tests/welt-k3-frachter.test.mjs
          node tools/k3-frachter-diagnose.mjs > "$RUNNER_TEMP/k3-diagnose.json"
          diff docs/K3_DIAGNOSE_SEED42.json "$RUNNER_TEMP/k3-diagnose.json"
      - name: "K4: zeitlich vorgezogene, vollständig finanzierte Original-Erzfracht"
        run: node --test tests/k4-ore-allocation.test.mjs
      - name: "K13/F6: gemeinsamer K7-/F6-Kern, Replay und getrennte Forschungsprofile"
        run: node --test tests/k13-f6-gemeinsamer-spielkern.test.mjs
      - name: "F8-A: Jaegerflug unter dem gemeinsamen F6-Integerintegrator"
        run: node --test tests/f8-jaeger-fluguebung.test.mjs tests/f8-jaeger-treffer.test.mjs tests/f8d-bewegliches-ziel.test.mjs tests/f8e-jaeger-duell.test.mjs
      - name: "K1-Wirtschaft: 15 Szenarien × 90 Tage, 365- und 730-Tage-Läufe"
        run: node --test tests/welt-wirtschaft.test.mjs
      - name: "Alle bestehenden Regel14-/Regel195-/Flug-Regressionen"
        run: node --test tests/*.test.mjs
      - name: "Einzeldatei-Build entspricht exakt der Kernquelle"
        run: node scripts/build-w5-singlefile.mjs --check
  browser-vier-groessen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Playwright nur als CI-Werkzeug, keine Laufzeitabhängigkeit des Spiels"
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/welt-playwright" playwright@1.62.0
          node "$RUNNER_TEMP/welt-playwright/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: "K1 im Browser: Touch, Kreislauf, IndexedDB-Autosave, Export/Import, Regel195-Übernahme"
        run: node tests/welt-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-cockpit-browser.cjs"
        run: node tests/welt-cockpit-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-miner-bergbaurunde-browser.cjs"
        run: node tests/welt-miner-bergbaurunde-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-rundenfuehrung-browser.cjs"
        run: node tests/welt-rundenfuehrung-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-frachter-handflug-browser.cjs"
        run: node tests/welt-frachter-handflug-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-spieler-eisfracht-browser.cjs"
        run: node tests/welt-spieler-eisfracht-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-transitkorridor-browser.cjs"
        run: node tests/welt-transitkorridor-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-torfreigabe-browser.cjs"
        run: node tests/welt-torfreigabe-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-kartenflug-browser.cjs"
        run: node tests/welt-kartenflug-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: welt-gesamtspiel-browser.cjs"
        run: node tests/welt-gesamtspiel-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "K13/F6: isolierter Rule200-Browser mit bezahltem Spielerfrachter"
        run: node tests/k13-f6-spieltest-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "F8-A: 2D-Jaegerfluguebung in Chromium/WebKit und vier Touchgroessen"
        run: node tests/f8-jaeger-fluguebung-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "F8-D: bewegliche Drohne in Chromium/WebKit und vier Touchgrößen"
        run: node tests/f8d-bewegliches-ziel-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "F8-E: Gegnerfeuer, Pilotenschaden, Sieg/Niederlage in beiden Browsern"
        run: node tests/f8e-jaeger-duell-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "Bildschirmfotos der vier Größen archivieren"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-k1-${{ matrix.browser }}
          path: /tmp/welt-k1-*.png
          if-no-files-found: warn
  k4-vergleich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K4: 14 Tage Seed42/7, S12-Basis gegen Original-W3-Aufträge"
        run: |
          node tools/k4-ore-allocation.mjs 42 14 > "$RUNNER_TEMP/k4-seed42.json"
          node tools/k4-ore-allocation.mjs 7 14 > "$RUNNER_TEMP/k4-seed7.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const seed of [42, 7]) {
            const { basis, vorExport } = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/k4-seed' + seed + '.json', 'utf8'));
            for (const [modus, r] of [['basis', basis], ['vorExport', vorExport]]) {
              console.log('K4_RESULT ' + JSON.stringify({
                seed, modus, tick: r.tick, hash: r.hash,
                weltgeld: r.weltgeld, minted: r.minted, burned: r.burned,
                audit: r.audit, nullsaldo: r.nullsaldo,
                erz: r.erz, material: r.material, wasser: r.wasser,
                neueW3: r.manuelleW3Auftraege, quoteAblehnungen: r.quoteAblehnungen,
                frachterInsgesamt: r.frachter.length,
                frachterAktiv: r.frachter.filter(s => !s.stillgelegt).length,
              }));
            }
          }
          NODE
      - name: "K4: 30/90 Tage S12-Krisenprobe, beide Seeds, keine Erfolgsannahme"
        run: |
          for tage in 30 90; do
            for seed in 42 7; do
              node tools/k4-ore-allocation.mjs "$seed" "$tage" > "$RUNNER_TEMP/k4-${tage}tage-seed${seed}.json"
            done
          done
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const tage of [30, 90]) for (const seed of [42, 7]) {
            const { basis, vorExport } = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/k4-' + tage + 'tage-seed' + seed + '.json', 'utf8'));
            for (const [modus, r] of [['basis', basis], ['vorExport', vorExport]]) {
              assert.equal(r.tick, tage * 1440);
              assert.equal(r.weltgeld, 33000);
              assert.equal(r.minted, 0);
              assert.equal(r.burned, 0);
              assert.equal(r.audit, true);
              assert.equal(r.nullsaldo, 0);
              console.log('K4_LANG ' + JSON.stringify({
                tage, seed, modus, tick: r.tick, hash: r.hash,
                erz: r.erz, material: r.material, wasser: r.wasser,
                frachterInsgesamt: r.frachter.length,
                frachterAktiv: r.frachter.filter(s => !s.stillgelegt).length,
                w3Interventionen: r.manuelleW3Auftraege.length,
                weltgeld: r.weltgeld, minted: r.minted, burned: r.burned, audit: r.audit,
              }));
            }
          }
          NODE
      - name: "K4: 30-/90-Tage-Originaldaten archivieren"
        uses: actions/upload-artifact@v4
        with:
          name: k4-s12-lang-30-90-seed42-7
          path: |
            ${{ runner.temp }}/k4-30tage-seed42.json
            ${{ runner.temp }}/k4-30tage-seed7.json
            ${{ runner.temp }}/k4-90tage-seed42.json
            ${{ runner.temp }}/k4-90tage-seed7.json
          if-no-files-found: error
      - name: "K4: vollständige Seed42/7-Originaldaten archivieren"
        uses: actions/upload-artifact@v4
        with:
          name: k4-s12-14tage-seed42-7
          path: |
            ${{ runner.temp }}/k4-seed42.json
            ${{ runner.temp }}/k4-seed7.json
          if-no-files-found: error

  k5-terminaldiagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K5: 90 Tage unverändertes K4, Seeds42/7 und genau eine finanzierte 50-Eis-Kette"
        run: |
          node --test tests/k5-terminal-diagnose.test.mjs
          node tools/k5-terminal-diagnose.mjs 42 90 > "$RUNNER_TEMP/k5-seed42.json"
          node tools/k5-terminal-diagnose.mjs 7 90 > "$RUNNER_TEMP/k5-seed7.json"
      - name: "K5: Minuten, Eigentümer, Zahlungsbelege und Save/Load archivieren"
        uses: actions/upload-artifact@v4
        with:
          name: k5-terminaldiagnose-seed42-7
          path: |
            ${{ runner.temp }}/k5-seed42.json
            ${{ runner.temp }}/k5-seed7.json
          if-no-files-found: error

  k6-eisdisposition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K6: Original-NPC-0/1/2/4-Miner mit unabhängigen Seed42/7-Audits und K5-Referenzhash"
        run: node --test tests/k6-eisdisposition.test.mjs
      - name: "K6: vollständige Zahlungen, Waren, Restvermögen und Krisen zur Prüfung archivieren"
        run: |
          node tools/k6-eisdisposition.mjs 42 > "$RUNNER_TEMP/k6-seed42.jsonl"
          node tools/k6-eisdisposition.mjs 7 > "$RUNNER_TEMP/k6-seed7.jsonl"
          node tools/k6-eisdisposition.mjs 42 7000 --dauer > "$RUNNER_TEMP/k6-ausdauer-seed42.jsonl"
          node tools/k6-eisdisposition.mjs 7 7000 --dauer > "$RUNNER_TEMP/k6-ausdauer-seed7.jsonl"
          grep '^K6_RESULT ' "$RUNNER_TEMP/k6-seed42.jsonl"
          grep '^K6_RESULT ' "$RUNNER_TEMP/k6-seed7.jsonl"
          grep '^K6_AUSDAUER ' "$RUNNER_TEMP/k6-ausdauer-seed42.jsonl"
          grep '^K6_AUSDAUER ' "$RUNNER_TEMP/k6-ausdauer-seed7.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: k6-npc-eisdisposition-seed42-7
          path: |
            ${{ runner.temp }}/k6-seed42.jsonl
            ${{ runner.temp }}/k6-seed7.jsonl
            ${{ runner.temp }}/k6-ausdauer-seed42.jsonl
            ${{ runner.temp }}/k6-ausdauer-seed7.jsonl
          if-no-files-found: error

  k7-industrielles-erz-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K7: Industriekassen und exakt fünf abgelehnte Originalaufträge bei erschöpftem Erzexport prüfen"
        run: |
          node --test tests/k7-industrieerz-gate.test.mjs
          node tools/k7-industrieerz-gate.mjs 42 > "$RUNNER_TEMP/k7-seed42.jsonl"
          node tools/k7-industrieerz-gate.mjs 7 > "$RUNNER_TEMP/k7-seed7.jsonl"
          grep '^K7_RESULT ' "$RUNNER_TEMP/k7-seed42.jsonl" | cut -c1-1800
          grep '^K7_RESULT ' "$RUNNER_TEMP/k7-seed7.jsonl" | cut -c1-1800
      - name: "K7: tatsächliche Original-Kassen, Quoten und Ablehnungsgründe archivieren"
        uses: actions/upload-artifact@v4
        with:
          name: k7-industrieerz-finanzierung-seed42-7
          path: |
            ${{ runner.temp }}/k7-seed42.jsonl
            ${{ runner.temp }}/k7-seed7.jsonl
          if-no-files-found: error

  k7-original-vertrag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K7 Regel200: echte Eigentümerzustimmungen, originaler W3-Erzkauf, W1/W4/W5-Kette, Storno"
        run: node --test tests/k7-industrieerz-vertrag.test.mjs
      - name: "K7 Regel200: Migrationsschutz, Vertragsmanipulation und atomare Abwehr"
        run: node --test tests/k7-vertragsabwehr.test.mjs

  k8-zweiter-industrieauftrag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K8: zwei Krisenseeds und zwei Finanzierungs-/Dispositionsregime, reale zweite Bestellung"
        run: node --test tests/k8-zweiter-industrieerz-vertrag.test.mjs

  k9-zweite-w4-w5-kette:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K9: zweite industrielle Erzlieferung zu W4-Material, W5-Eigentumskauf und bezahltem Ersatzflug"
        run: node --test tests/k9-zweite-w4-w5-kette.test.mjs

  k10-dritter-industriezyklus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K10: Seed42/7 dritter und Folgevertraege, komplette W1-W5-Kette und Finanzierungsgrenze"
        run: node --test tests/k10-dritter-industriezyklus.test.mjs

  k11-reale-frachternachfrage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K11: echte Lagerhüllen, freie Eigentümerfrachter, bezahlte Nachfrage und Original-Stilllegung vergleichen"
        run: node --test tests/k11-realer-frachterbedarf.test.mjs

  k12-eisfracht-geldkreislauf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K12: echte Eisfracht-Käuferkasse und 74-ISK-Crewblockade, keine Gratisanzahlung"
        run: node --test tests/k12-eisfracht-geldkreislauf.test.mjs

  k13-zwei-echte-finanzbruecken:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K13: unterschriebene Original-Eisfracht aus Kundenlohnvorschuss vs Eigentuemereinlage"
        run: node --test tests/k13-zwei-echte-finanzbruecken.test.mjs
