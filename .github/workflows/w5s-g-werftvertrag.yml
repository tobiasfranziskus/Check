name: W5s-g – vorfinanzierter Schiffbauvertrag
on:
  push:
    branches:
      - feature/w5s-g-bezahlter-werftvertrag-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-g-werftvertrag.test.mjs
      - .github/workflows/w5s-g-werftvertrag.yml
jobs:
  werftvertrag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-g-werftvertrag.test.mjs
