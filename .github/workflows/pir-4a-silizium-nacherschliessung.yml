name: PIR-4a / W6 – Silizium-Nacherschließung
on:
  pull_request:
    paths:
      - 'tests/pir-4a-silizium-nacherschliessung.test.mjs'
      - '.github/workflows/pir-4a-silizium-nacherschliessung.yml'
      - 'prototypes/welt/**'
  workflow_dispatch:
jobs:
  original-core-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pir-4a-silizium-nacherschliessung.test.mjs
