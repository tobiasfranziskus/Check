name: W6 S02 alternative miner
on:
  pull_request:
    branches:
      - research/w6-s02-letzte-frachtrunde-20261126
    paths:
      - 'tools/w6-s02-alternativminer.cjs'
      - 'tools/w6-s02-letzte-frachtrunde.cjs'
      - 'tools/w6-s02-vertragsvorsorge.cjs'
      - '.github/workflows/w6-s02-alternativminer.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run alternative candidate and exact control
        run: |
          node --check tools/w6-s02-letzte-frachtrunde.cjs
          node --check tools/w6-s02-vertragsvorsorge.cjs
          node --check tools/w6-s02-alternativminer.cjs
          node tools/w6-s02-alternativminer.cjs w6-alternativminer.json
      - uses: actions/upload-artifact@v4
        with:
          name: w6-alternativminer
          path: w6-alternativminer.json
          if-no-files-found: error
