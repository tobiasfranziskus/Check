name: W6 funded water preorder admission
on:
  pull_request:
    branches:
      - research/w6-geldumlauf-wasser-20261126
    paths:
      - 'tools/w6-wasser-vorbestellung*.cjs'
      - '.github/workflows/w6-wasser-vorbestellung.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [S02, S08, S12]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Validate voluntary preorder admission on original world states
        run: |
          node --check tools/w6-wasser-vorbestellung.cjs
          node --check tools/w6-wasser-vorbestellung-audit.cjs
          node tools/w6-wasser-vorbestellung-audit.cjs ${{ matrix.scenario }} report.json
      - uses: actions/upload-artifact@v4
        with:
          name: wasser-vorbestellung-${{ matrix.scenario }}
          path: report.json
          if-no-files-found: error
