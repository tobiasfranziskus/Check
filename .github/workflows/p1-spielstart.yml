name: "P1 – Echtes neues Spiel, Konzernprolog und RAUM-Cockpit"
on:
  pull_request:
    paths:
      - 'prototypes/spiel/**'
      - 'prototypes/tutorial-manager/**'
      - 'prototypes/tutorial-pilot/**'
      - 'prototypes/raum/**'
      - 'prototypes/flug2d/**'
      - 'prototypes/verbund/**'
      - 'tests/p2-*'
      - 'tests/p1-*'
      - 'tests/p3-handelsweg-browser.cjs'
      - 'tests/p4-karriere-patrouille.test.mjs'
      - 'tests/p4-karriere-duell.test.mjs'
      - 'tests/tutorial-pilot-*'
      - 'prototypes/f8-jaeger/**'
      - 'prototypes/j4c/duell.js'
      - 'prototypes/j4c/patrouille.js'
      - 'scripts/build-w5-singlefile.mjs'
      - 'index.html'
      - '.github/workflows/p1-spielstart.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-file-start-and-core-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "P1 realer Regel195-Spielstart und bezahlter F6-Minerflug"
        run: node --test tests/p1-spieleinstieg.test.mjs tests/p2-zielsteuerung.test.mjs tests/p4-karriere-patrouille.test.mjs tests/p4-karriere-duell.test.mjs tests/p1-managerakademie.test.mjs tests/tutorial-pilot-core.test.mjs tests/p1-pilot-integration.test.mjs tests/p2-flugpruefung.test.mjs tests/p3-handelsweg.test.mjs tests/p3-reinvestition.test.mjs tests/p3-wasserlohn.test.mjs tests/p3-npc-markt.test.mjs tests/p3-npc-frachterbeschaffung.test.mjs tests/p3-industrie.test.mjs
      - name: "Öffentliche Root-Navigation reproduzierbar; NAS-W0–W5 unverändert"
        run: node scripts/build-w5-singlefile.mjs --check
      - name: "Öffentlichen Root- und Karriere-Einstieg unabhängig per HTTP prüfen"
        run: |
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:index.html > "$RUNNER_TEMP/m4-main-root.html"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 https://tobiasfranziskus.github.io/Check/ -o "$RUNNER_TEMP/m4-public-root.html"
          cmp "$RUNNER_TEMP/m4-main-root.html" "$RUNNER_TEMP/m4-public-root.html"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 https://tobiasfranziskus.github.io/Check/prototypes/spiel/index.html -o "$RUNNER_TEMP/m4-public-career.html"
          node -e 'const fs=require("node:fs");const assert=require("node:assert/strict");assert.match(fs.readFileSync(process.env.RUNNER_TEMP+"/m4-public-career.html","utf8"),/id="karriere-starten"/);console.log("M4_PUBLIC_HTTP_OK: unchanged root and public career entry reachable; candidate interactions tested separately");'
  real-game-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Playwright nur im CI installieren"
        id: playwright
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/p1-playwright" playwright@1.62.0
          node "$RUNNER_TEMP/p1-playwright/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: "M4/S1: Sektorkarte, Original-Eisfahrt und Save/Load in vier Touchgrößen"
        run: node tests/p3-manager-karte-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "M4: Operationsboard, Originalphasen und Kartenbedienung in vier Touchgrößen"
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: node tests/p3-operationsboard-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "M-UX1: frischer Karrierestart und P3-Eisfracht in vier Touchgrößen"
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: node tests/p3-handelsweg-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "P2 Flugprüfung: fünf echte Etappen und Welt-Audit in vier Touchgrößen"
        run: node tests/p2-flugpruefung-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "4 Touchgrößen: Root → Prolog → neue echte Karriere → bezahlter Miner → Cockpit → Save/Load"
        run: node tests/p1-spielstart-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "P1 Pilotenakademie: 13 Lektionen, ursprüngliche Flugübungen erhalten"
        run: node tests/tutorial-pilot-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          TUTORIAL_BROWSERS: ${{ matrix.browser }}
      - name: "J11+P1: echter Spielstart, bezahlter Frachter und Miner, Eisauftrag, F4-Rundfracht und Save"
        run: node tests/p1-j11-career-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/p1-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
