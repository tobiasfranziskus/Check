name: M4-U4 visueller KI-Blindtest (mobil)
on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Blindtestmodul A–F'
        type: choice
        options:
          - A
          - B
          - C
          - D
          - E
          - F
        default: A
      consent:
        description: 'Viewport-Bilder an OpenRouter (Gemma 4 Free) senden; Bilder und Testprotokoll als GitHub-Artefakt speichern'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: m4-u4-live-pilot
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch and consent (no secret)
        env:
          M4_CONSENT: ${{ inputs.consent }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo 'Bitte main auswählen.' >&2; exit 1; fi
          if [ "$M4_CONSENT" != true ]; then echo 'Consent fehlt: Bitte Zustimmung aktivieren.' >&2; exit 1; fi
  pilot:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.consent == true
    environment: m4-blindtest
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser without model credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/m4-ui" playwright@1.51.1
          "$RUNNER_TEMP/m4-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run screenshot-only module
        env:
          M4_MODULE: ${{ inputs.module }}
          M4_AI_MODEL: google/gemma-4-26b-a4b-it:free
          M4_OBSERVATION_MODE: screenshot-only
          M4_AI_PROVIDER: openrouter
          M4_ALLOW_REMOTE: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          M4_PRODUCT_SHA: ${{ github.sha }}
          TMPDIR: ${{ runner.temp }}/m4-live
        run: |
          mkdir -p "$TMPDIR"
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo 'Fehlendes Environment-Secret OPENROUTER_API_KEY.' >&2
            exit 1
          fi
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/m4-ui/node_modules/playwright"
          node scripts/m4-u4-model-runner.cjs "$M4_MODULE" . > "$TMPDIR/result.json"
      - name: Summarize transport status, not UX verdict
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/m4-live
        run: |
          node -e '
            const fs=require("node:fs"),path=require("node:path");
            let r; try {r=JSON.parse(fs.readFileSync(path.join(process.env.TMPDIR,"result.json"),"utf8"));} catch {r={reason:"INFRASTRUCTURE",detail:"Pilot setup incomplete",actions:0};}
            const reason=["INFRASTRUCTURE","MODEL_STOP","LIMIT"].includes(r.reason)?r.reason:"INFRASTRUCTURE";
            const n=Number.isInteger(r.actions)&&r.actions>=0&&r.actions<=12?r.actions:"unbekannt";
            const allowed=["Invalid model decision format","Invalid model JSON","Model output truncated","Model output empty","Unverified free model identity","Model identity mismatch","Model response too large","Empty model response","Invalid provider JSON","Model transport or response failed","Model timeout","Browser observation failed","Browser action failed","Current viewport image unavailable","Native browser dialog unsupported; infrastructure blocked","Screenshot-only requires a verified free image model and explicit consent","Pilot setup incomplete"];
            const detail=reason==="INFRASTRUCTURE"&&(allowed.includes(r.detail)||/^Model HTTP [0-9]{3}$/.test(r.detail))?r.detail:reason==="INFRASTRUCTURE"?"Keine sichere Detaildiagnose verfügbar.":"-";
            const pinned=r.model;
            const model=typeof pinned==="string"&&pinned.length<=160&&/^[A-Za-z0-9._/-]+:free$/.test(pinned)?pinned:"Noch nicht festgelegt";
            const sources={openrouter_free_tier_per_minute:"OpenRouter-Minutenlimit",openrouter_free_tier_daily:"OpenRouter-Tageslimit",upstream_provider_shared_pool:"Modellanbieter ausgelastet",openrouter_in_flight_budget:"OpenRouter-Budget laufender Anfragen",openrouter_key_limit:"Schlüssellimit",openrouter_credits:"Guthabenlimit",unknown:"Quelle nicht gemeldet"};
            const source=reason==="INFRASTRUCTURE"&&Object.hasOwn(sources,r.quota?.limitSource)?sources[r.quota.limitSource]:"-";
            const reset=r.quota?.resetAt;
            const resetText=Number.isSafeInteger(reset)&&reset>=1000000000000&&reset<=8640000000000000?new Date(reset).toISOString():"nicht gemeldet";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## M4-U4 Screenshot-only\n\nTransportstatus: "+reason+"\n\nDiagnose: "+detail+"\n\nLimitquelle: "+source+"\n\nReset (UTC): "+resetText+"\n\nBestätigtes Modell: "+model+"\n\nAktionen: "+n+"\n\nSpielabnahme: UNREVIEWED. Evidenz separat bewerten.\n");
            if(reason==="INFRASTRUCTURE") process.exitCode=1;
          '
      - name: Upload isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-u4-pilot-${{ inputs.module }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m4-live/result.json
            ${{ runner.temp }}/m4-live/m4-u4-model-*/evidence.jsonl
            ${{ runner.temp }}/m4-live/m4-u4-model-*/round-*.png
          retention-days: 7
          if-no-files-found: warn
