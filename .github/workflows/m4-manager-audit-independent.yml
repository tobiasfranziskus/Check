name: M4 integrated 60-day manager reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/m4-manager-audit-independent.yml'
      - 'tests/codex-m4-alternative-manager-audit.cjs'
      - 'prototypes/**'
      - 'tools/w6-szenarien.cjs'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: standard-etappen
            hash: 3283b7ce2844a8e4
            cash: '16780'
            week: '1548'
            receipts: '3000'
            costs: '1200'
          - strategy: s02-werft-etappen-ersatz
            hash: abf9e75658e929e4
            cash: '11315'
            week: '417'
            receipts: '2010'
            costs: '1404'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual integration checkout and independent replay
        env:
          STRATEGY: ${{ matrix.strategy }}
          EXPECT_HASH: ${{ matrix.hash }}
          EXPECT_CASH: ${{ matrix.cash }}
          EXPECT_WEEK: ${{ matrix.week }}
          EXPECT_RECEIPTS: ${{ matrix.receipts }}
          EXPECT_COSTS: ${{ matrix.costs }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format="%H %P"
          node --version
          node --test --test-name-pattern="^(Original-Genesis|$STRATEGY ·)" tests/codex-m4-alternative-manager-audit.cjs > "$RUNNER_TEMP/manager-audit.log"
          node - "$RUNNER_TEMP/manager-audit.log" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const log = fs.readFileSync(process.argv[2], 'utf8');
          const marker = 'CODEX_M4_ALTERNATIVE_RESULT ';
          const lines = log.split(/\r?\n/);
          const starts = lines.map((line, i) => line.startsWith('# ' + marker) ? i : -1).filter(i => i >= 0);
          assert.equal(starts.length, 1, 'exactly one audited strategy');
          const start = starts[0];
          let payload = lines[start].slice(('# ' + marker).length);
          let i = start + 1;
          while (i < lines.length && lines[i].startsWith('# ') && !lines[i].startsWith('# Subtest:')) {
            payload += lines[i++].slice(2);
          }
          const a = JSON.parse(payload);
          const end = a.checkpoints['day-60'];
          assert.equal(a.strategy, process.env.STRATEGY);
          assert.equal(a.activeUntilDay60, true);
          assert.equal(end.tick, 86400);
          assert.equal(end.hash, process.env.EXPECT_HASH);
          assert.equal(end.cash.house, Number(process.env.EXPECT_CASH));
          assert.equal(a.lastWeek.cashChange, Number(process.env.EXPECT_WEEK));
          assert.equal(a.lastWeek.receipts, Number(process.env.EXPECT_RECEIPTS));
          assert.equal(a.lastWeek.costs, Number(process.env.EXPECT_COSTS));
          assert.ok(a.lastWeek.lastDayReceipts > 0, 'paid activity in last 24 hours');
          assert.ok(a.lastWeek.paidDays >= 2);
          assert.equal(end.world.money, 33000);
          assert.equal(end.world.minted, 0);
          assert.equal(end.world.burned, 0);
          assert.match(log, /^# fail 0$/m);
          assert.match(log, /^# pass 2$/m);
          const summary = { strategy: a.strategy, tick: end.tick, hash: end.hash, cash: end.cash.house,
            lastWeek: a.lastWeek, world: end.world, activeUntilDay60: a.activeUntilDay60 };
          console.log('INDEPENDENT_MANAGER_PASS', JSON.stringify(summary));
          fs.writeFileSync(process.argv[2] + '.json', JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-audit-${{ matrix.strategy }}
          path: |
            ${{ runner.temp }}/manager-audit.log
            ${{ runner.temp }}/manager-audit.log.json
