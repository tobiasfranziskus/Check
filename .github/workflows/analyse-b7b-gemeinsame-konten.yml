name: Aphros Void B7b - gemeinsame Schiffs-/Auftragskonten
on:
  pull_request:
    paths:
      - tools/analyse-b7b-gemeinsame-konten.mjs
      - .github/workflows/analyse-b7b-gemeinsame-konten.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b7b-seed42-10days:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historische B1-Befehle fixieren
        run: |
          git fetch origin 6855d76bb374dd777a1b7e30ea52c9a6eca36399
          mkdir -p "$RUNNER_TEMP/b7b-b1" "$RUNNER_TEMP/b7b-out"
          git archive 6855d76bb374dd777a1b7e30ea52c9a6eca36399 | tar -x -C "$RUNNER_TEMP/b7b-b1"
      - name: Reine Regel14 Kontrolle Tag1-10
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=control --days=10 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: B7b Einziger Finanzierungsversuch inklusive Spielerbefehl
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --days=10 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: Langlauf dieselbe unveraenderte Kontrolle 90 Tage
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=control --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: Langlauf dieselbe gemeinsame Walletregel 90 Tage
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: Vergleich ueber unveraenderte Kontrolle und Geldquellen
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const d=process.env.RUNNER_TEMP+"/b7b-out/";
            const read=(mode,days)=>JSON.parse(fs.readFileSync(d+"b7b-handel-flotte-42-"+mode+"-"+days+"d.json"));
            for(const days of [10,90]){
              const c=read("control",days),w=read("wallet",days);
              for(const x of [c,w]){
                assert.equal(x.days,days);assert.equal(x.hours,days*24);assert.equal(x.roundtrips,days===10?8:14);
                assert.equal(x.commands,7);assert.equal(x.daily.length,days);assert.equal(x.h1.paid,0);
                assert.equal(x.sourceSha256,"035fe8b486ff2d515ca6379ad682b4b15d89d5d051866e287425ed425e1cbfc9");
                assert.equal(55000+x.final.minted-x.final.burned,50000,"Weltgeld-Summe muss alle vorhandenen Schiffs-/Konzernkassen enthalten");
              }
              assert.equal(c.variantSha256,c.sourceSha256);
              assert.notEqual(w.variantSha256,w.sourceSha256);
              assert.equal(w.wallet.manualFund.owner,"house");
              assert.equal(w.wallet.manualFund.betrag,1000);
              assert.equal(w.wallet.manualFundExecuted,true);
              assert.equal(w.manualFlightProof.rejectedBeforeFunding,true);
              assert.equal(w.manualFlightProof.departedAfterFunding,true);
              assert(w.manualFlightProof.fare>0);
              if(days===10)assert.equal(c.final.hash,"84f1a88d2701ff2a","gepinntes B7a/H1-C3-Kontrollhash");
              if(days===90){
                assert.equal(c.daily[9].hash,read("control",10).final.hash,"Kontrolle Tag10 identisch");
                assert.equal(w.daily[9].hash,read("wallet",10).final.hash,"Wallet Tag10 identisch");
              }
              console.log("B7B_CAUSAL_COMPARISON",JSON.stringify({
                days,
                control:{cash:c.final.npc,shortage:c.final.shortage,sales:c.traderSales,unpaid:c.unpaid,paid:c.paid,due:c.due,consumption:c.consumerAudit.aggregate,playerCash:c.final.playerCash,minted:c.final.minted,burned:c.final.burned,alderaParts:c.final.partsAldera},
                sharedWallet:{cash:w.final.npc,shortage:w.final.shortage,sales:w.traderSales,unpaid:w.unpaid,paid:w.paid,due:w.due,consumption:w.consumerAudit.aggregate,playerCash:w.final.playerCash,minted:w.final.minted,burned:w.final.burned,walletCash:w.final.walletCash,walletCount:w.final.walletCount,alderaParts:w.final.partsAldera},
              }));
            }
          '
      - name: Read-only Ursache Tag 10 bis 15 gegen alte 90-Tage-Hashes verifizieren
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            for(const mode of ["control","wallet"]){
              const x=JSON.parse(fs.readFileSync(dir+"b7b-handel-flotte-42-"+mode+"-90d.json"));
              const diagnostics=x.b7cDiagnostics;
              assert.equal(diagnostics.length,145,"Tage9-15 je Stunde einschliesslich beider Randpunkte");
              const originalFinal=mode==="control"?"784047684dfe5c56":"82f11deee8c7f566";
              assert.equal(x.final.hash,originalFinal,"reines Beobachten aendert keinen B7b-Zustand");
              for(const day of [9,10,11,12,13,14,15]){
                const a=diagnostics.find(s=>s.tick===day*1440);
                assert(a,"Tagessnapshot muss existieren");
                const baseline=x.daily[day-1];
                assert.equal(a.cash.player,baseline.playerCash);
                assert.equal(a.cash.npc1,baseline.npc.npc1.cash);
                assert.equal(a.cash.npc2,baseline.npc.npc2.cash);
                assert.equal(a.stations.reduce((n,s)=>n+s.completed,0),baseline.recipes);
                const consumers=a.stations.filter(s=>s.consumer.some(x=>x.ware==="nahrung"));
                const stationsAffordable=consumers.filter(s=>s.consumer.some(v=>v.canBuyOne)).length;
                const statuses=a.stations.flatMap(s=>s.recipes).reduce((o,v)=>(o[v.status]=(o[v.status]||0)+1,o),{});
                const lastConsumers=x.consumerAudit.days[day-1].consumed;
                console.log("B7C_DAILY_CAUSE",JSON.stringify({mode,day,recipes:baseline.recipes,statuses,stock:a.totals,npc:a.cash,consumer:lastConsumers,stationsAffordable,stations:a.stations.map(s=>({id:s.id,cash:s.cash,stock:{nahrung:s.inventory.nahrung||0,medikamente:s.inventory.medikamente||0,bauteil:s.inventory.bauteil||0,erz:s.inventory.erz||0,silizium:s.inventory.silizium||0,material:s.inventory.material||0},blocked:s.recipes.filter(r=>r.status!=="running").map(r=>({recipe:r.recipe,reason:r.status,missing:r.missing,full:r.full}))})),ships:a.ships.filter(s=>s.owner==="npc1"||s.owner==="npc2")}));
              }
              if(mode==="wallet"){
                assert.equal(x.daily[14].recipes,x.daily[12].recipes,"nach Tag12 keine neue Fertigung im unveraenderten B7b-Lauf");
                assert.equal(x.consumerAudit.days[14].consumed.nahrung,0,"Tag15 Nullverbrauch");
                assert.equal(x.consumerAudit.days[14].consumed.medikamente,0);
              }
            }
          '
      - name: B7d reale Handelsangebote und Ursache der Marktsperre ohne Kerneingriff
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            const read=(mode,days)=>JSON.parse(fs.readFileSync(dir+"b7b-handel-flotte-42-"+mode+"-"+days+"d.json"));
            for(const mode of ["control","wallet"])for(const days of [10,90]){
              const x=read(mode,days),rows=x.b7dDiagnostics;
              assert.equal(rows.length,days===10?1:4,"Tag10 bzw 10,11,12,15");
              assert.deepEqual(rows.map(x=>x.day),days===10?[10]:[10,11,12,15]);
              for(const row of rows){
                assert.equal(row.routes.length,16,"16 exakt definierte Marktpaare");
                assert.equal(row.counts.candidateQuotes,7*6*3,"alle 126 gerichteten Paare fuer 3 Waren");
                assert(row.counts.prefundedWithShipAtSource<=row.counts.withEmptyShipAtSource);
                assert(row.counts.withEmptyShipAtSource<=row.counts.afterWorkPositive);
                assert(row.counts.afterWorkPositive<=row.counts.nominalPositive);
                for(const q of row.routes){
                  assert(q.qty>=0&&q.qty<=q.buyerCanTake);
                  assert(q.qty<=q.available);
                  assert(q.workCost>0&&q.fundNeed>=q.workCost);
                  if(q.financeable.length)assert(q.qty>0 && q.emptyDockedSource.length>0);
                }
                const named=row.routes.filter(q=>
                  q.origin==="st_meridian"&&q.ware==="nahrung"&&["st_aldera","st_cyris","st_nadir","st_orion"].includes(q.target) ||
                  q.ware==="silizium"&&q.target==="st_aldera");
                console.log("B7D_VERIFIED_QUOTE",JSON.stringify({
                  mode,day:row.day,count:row.counts,focus:named,
                  top:row.top.slice(0,5)
                }));
              }
              if(days===90)assert.deepEqual(rows[0],read(mode,10).b7dDiagnostics[0],"stabile Tag10-Marktangebote in 10-/90-Tageswelt");
              if(days===90)assert.equal(x.final.hash, mode==="control"? "784047684dfe5c56":"82f11deee8c7f566",
                "read-only Preisberechnung darf deterministischen Tag90-Endhash nicht aendern");
              else if(mode==="control")assert.equal(x.final.hash,"84f1a88d2701ff2a","gepinntes Tag10-Kontrollergebnis");
            }
          '
      - name: B7e reale Werftzahlung und bedingtes Einstiegskapital statt Gratis-Neugruendung
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            const read=(m,d)=>JSON.parse(fs.readFileSync(dir+"b7b-handel-flotte-42-"+m+"-"+d+"d.json"));
            for(const mode of ["control","wallet"])for(const days of [10,90]){
              const x=read(mode,days),entries=x.b7eDiagnostics;
              assert.deepEqual(entries.map(e=>e.day),days===10?[10]:[10,11,12,15]);
              for(const e of entries){
                assert.equal(e.shipyard,"st_aldera");
                assert(e.hullSellable>=1,"Werft-Huelle muss real existieren");
                assert(e.hullTotal>0);
                assert.equal(e.stationAfterShipSale,e.stationBefore+e.hullUnitPrice+(e.shipyardOwner?e.hullFee:0));
                const z=e.reQuotedAfterRealHullSale;
                assert(z.qty<=z.sourceStock&&z.qty<=z.buyerSpace);
                assert.equal(z.totalCashAtEntry,
                  e.hullTotal+z.emptyCost+z.purchaseBase+z.purchaseFee+z.loadedCost);
                assert.equal(z.realizedFirstCycleCashDelta,z.tradingMargin-z.emptyCost-e.hullTotal);
                assert.equal(z.buyerCashAfterFullSale,
                  e.stationAfterShipSale-z.saleBase);
                assert(z.buyerCashAfterFullSale>=0);
                console.log("B7E_REAL_CAPITAL_ENTRY",JSON.stringify({mode,day:e.day,hull:{
                  quantity:e.hullStock,sellable:e.hullSellable,price:e.hullUnitPrice,fee:e.hullFee,
                  sum:e.hullTotal,alderaFund:e.alderaFundCash},
                  buyerCash:{before:e.stationBefore,afterHullPurchase:e.stationAfterShipSale,
                    afterDeliveredSale:z.buyerCashAfterFullSale},
                  existingOffer:e.unmodifiedOffer,afterNewShipSale:z,owners:e.corporate}));
              }
              if(days===90)assert.deepEqual(entries[0],read(mode,10).b7eDiagnostics[0],"B7e Tag10 10d = 90d");
              if(days===90)assert.equal(x.final.hash,mode==="control"?"784047684dfe5c56":"82f11deee8c7f566",
                "read-only B7e-Erhebung veraendert keine Referenzhashes");
              else if(mode==="control")assert.equal(x.final.hash,"84f1a88d2701ff2a");
            }
          '
      - name: B7f echter NPC3-Einstieg 90 Tage, genau ein Kauf und reale Befehle
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --investment=npc3 --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: B7f Kausal- und Geld-/Waren-/Verbrauchervergleich mit unveraenderter B7b-Welt
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            const baseline=JSON.parse(fs.readFileSync(dir+"b7b-handel-flotte-42-wallet-90d.json"));
            const x=JSON.parse(fs.readFileSync(dir+"b7f-handel-flotte-42-wallet-90d.json"));
            assert.equal(baseline.final.hash,"82f11deee8c7f566","B7b eingefrorener Hash");
            assert.equal(x.hours,90*24);assert.equal(x.daily.length,90);
            assert.equal(x.roundtrips,14);
            assert.equal(x.b7fInvestment.enabled,true);
            assert.equal(x.b7fInvestment.stage,"completed");
            assert.equal(x.b7fInvestment.onceOnly,1);
            assert(x.b7fInvestment.quantity>0);
            assert(x.b7fInvestment.soldAt>x.b7fInvestment.createdAt);
            const events=x.b7fInvestment.events;
            assert(events.some(z=>z.type==="real-hull-purchased"));
            assert(events.some(z=>z.type==="silicon-purchase-submitted"));
            assert(events.some(z=>z.type==="loaded-flight-submitted"));
            assert(events.some(z=>z.type==="real-sale"&&z.qty>0));
            assert.equal(x.sourceSha256,baseline.sourceSha256);
            assert.equal(x.variantSha256,baseline.variantSha256);
            assert.equal(x.daily[14].hash,baseline.daily[14].hash,"bis vor B7f-Start gleiche Welt");
            console.log("B7F_REAL_INVESTMENT",JSON.stringify({
              paid:x.paid, due:x.due,unpaid:x.unpaid, hashes:{baseline90:baseline.final.hash,investor90:x.final.hash},
              investor:x.b7fInvestment,
              baselineFinal:baseline.final,investorFinal:x.final,
              baselineTrade:baseline.traderSales,investorTrade:x.traderSales,
              baselineCivil:baseline.consumerAudit.aggregate,
              investorCivil:x.consumerAudit.aggregate,
              baselineNpc3:baseline.owners.npc3,
              investorNpc3:x.owners.npc3,
              baselineLosses:baseline.losses.filter(z=>z.owner==="npc3"),
              investorLosses:x.losses.filter(z=>z.owner==="npc3"),
              firstDays:x.daily.filter(z=>[14,15,16,17,18,19,20,30,60,90].includes(z.day)),
            }));
          '
      - name: B7g alle Aldera-Kassenveraenderungen in realen Kernphasen auditieren
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const file=process.env.RUNNER_TEMP+"/b7b-out/b7f-handel-flotte-42-wallet-90d.json";
            const w=JSON.parse(fs.readFileSync(file)),f=w.b7fInvestment,g=w.b7gMoneyFlow;
            assert(g&&Array.isArray(g.events)&&g.events.length>1);
            assert.equal(g.fromTick,21600);
            assert.equal(g.days.length,76,"Tage15 bis 90 inklusive");
            assert.equal(g.days[0].day,15);
            assert.equal(g.days.at(-1).day,90);
            assert.equal(g.days[0].alderaCash,1603);
            assert.equal(g.days.at(-1).alderaCash,w.final.stationCash.st_aldera);
            let balance=g.events[0].from;
            const totals={income:0,outgo:0,phases:{}};
            for(const e of g.events){
              assert.equal(e.from,balance,"lueckenloser echter Aldera-Kassenweg");
              assert.equal(e.to-e.from,e.delta);
              assert(e.tick>=21600);
              assert(e.delta!==0);
              balance=e.to;
              if(e.delta>0)totals.income+=e.delta;else totals.outgo-=e.delta;
              const p=totals.phases[e.phase]||{income:0,outgo:0,n:0};
              if(e.delta>0)p.income+=e.delta;else p.outgo-=e.delta;
              p.n++;
              totals.phases[e.phase]=p;
            }
            assert.equal(balance,w.final.stationCash.st_aldera,"lueckenlose Kasse bis Ende90");
            assert.equal(totals.income-totals.outgo,balance-g.events[0].from);
            const onDay16=g.events.filter(e=>e.tick>=f.createdAt&&e.tick<=17*1440);
            assert(onDay16.length>0);
            const afterSale=g.events.filter(e=>e.tick>=f.soldAt);
            assert(afterSale.length>0);
            const profitableSnapshots=g.days.flatMap(d=>d.quotes
              .filter(q=>q.qty>0&&q.margin>0).map(q=>({day:d.day,src:q.src,qty:q.qty,profit:q.margin,
                buyerCash:d.alderaCash,available:q.sellable,ship:d.ship})));
            const secondPotential=profitableSnapshots.filter(q=>q.day>=16);
            console.log("B7G_ALDERA_LEDGER",JSON.stringify({
              startCash:g.events[0].from,endCash:balance,
              totals,events:g.events.length,
              day16to18:g.events.filter(e=>e.tick>=15*1440&&e.tick<=18*1440),
              firstAfterSale:afterSale.slice(0,20),
              laterEvents:afterSale.filter(e=>e.tick>18*1440).slice(0,20),
              allDays:g.days.filter(d=>[15,16,17,18,19,20,21,22,25,30,60,90].includes(d.day))
                .map(d=>({day:d.day,cash:d.alderaCash,fundCash:d.fundCash,npc3Cash:d.npc3Cash,
                  inventory:d.alderaSilizium,parts:d.alderaBauteil,
                  production:d.recipes,ship:d.ship,
                  quotes:d.quotes.map(q=>({src:q.src,sellable:q.sellable,qty:q.qty,margin:q.margin,
                    funds:q.fundNeed,reasons:q.reasons}))})),
              afterSaleProfitableCount:secondPotential.length,
              afterSaleProfitableFirst:secondPotential.slice(0,10),
              finalShortage:w.final.shortage,finalProduction:w.final.recipes,
              referenceHash:w.final.hash
            }));
          '
      - name: B7h vorhandenen NPC3-Frachter durch validierten Handelsbefehl autonom handeln lassen
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --investment=npc3 --autotrade=on --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: B7h echte Folgegeschaefte, vollstaendige Kosten und 90-Tage-Nachfrage gegen B7f vergleichen
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            const f=JSON.parse(fs.readFileSync(dir+"b7f-handel-flotte-42-wallet-90d.json"));
            const x=JSON.parse(fs.readFileSync(dir+"b7h-handel-flotte-42-wallet-90d.json"));
            assert.equal(f.final.hash,"23eb3796fb0b5ec3","B7f-Referenz-Hash");
            assert.equal(x.days,90);assert.equal(x.hours,2160);assert.equal(x.daily.length,90);
            assert.equal(x.roundtrips,14);
            assert.equal(x.initialHash,f.initialHash);
            assert.equal(x.sourceSha256,f.sourceSha256);
            assert.equal(x.variantSha256,f.variantSha256,"keine weitere Produktkern-Aenderung");
            assert.deepEqual(x.daily.slice(0,15),f.daily.slice(0,15),"bis Tag15 beide Welten identisch");
            assert.equal(x.b7fInvestment.onceOnly,1,"kein zweites kostenloses Schiff");
            assert.equal(x.b7fInvestment.ship,f.b7fInvestment.ship,"identischer gekaufter Frachter");
            assert.equal(x.b7fInvestment.quantity,f.b7fInvestment.quantity,"dieselbe erste Lieferung");
            assert.equal(x.b7fInvestment.soldAt,f.b7fInvestment.soldAt,"identischer erster Verkaufszeitpunkt");
            assert.equal(x.b7hAuto.activatedAt,f.b7fInvestment.soldAt+1);
            assert.equal(x.b7hAuto.ship,x.b7fInvestment.ship);
            assert.equal(x.b7hAuto.command.type,"shipHandeln");
            assert.deepEqual(x.b7hAuto.tradeEvents.filter(e=>e.ware==="silizium").slice(0,2).map(e=>({kauf:e.kauf,ware:e.ware,menge:e.menge})),
              [{kauf:true,ware:"silizium",menge:55},{kauf:false,ware:"silizium",menge:55}],
              "erste real bezahlte Lieferung bleibt gleich");
            const latter=x.b7hAuto.tradeEvents.filter(e=>e.tick>x.b7fInvestment.soldAt);
            const buys=latter.filter(e=>e.kauf),sells=latter.filter(e=>!e.kauf);
            const aggregates=trades=>Object.groupBy(trades,e=>e.ware);
            console.log("B7H_REAL_AUTOTRADING",JSON.stringify({
              ship:x.b7hAuto.ship, activation:x.b7hAuto.activation,
              tradeEventsTotal:x.b7hAuto.tradeEvents.length,
              laterBuys:buys.length,laterSells:sells.length,
              laterGoodsBuys:Object.fromEntries(Object.entries(aggregates(buys)).map(([k,v])=>[k,v.reduce((n,e)=>n+e.menge,0)])),
              laterGoodsSells:Object.fromEntries(Object.entries(aggregates(sells)).map(([k,v])=>[k,v.reduce((n,e)=>n+e.menge,0)])),
              sampleTrades:latter.slice(0,25),lastTrades:latter.slice(-8),
              baseline:{endHash:f.final.hash,cash:f.final.npc,shortage:f.final.shortage,
                recipes:f.final.recipes,consumption:f.consumerAudit.aggregate,
                sold:f.owners.npc3?.sells,paid:f.paid,due:f.due,unpaid:f.unpaid,losses:f.losses.filter(z=>z.owner==="npc3").length,
                endShipAlive:!!f.b7gMoneyFlow.days.at(-1).ship},
              candidate:{endHash:x.final.hash,cash:x.final.npc,shortage:x.final.shortage,
                recipes:x.final.recipes,consumption:x.consumerAudit.aggregate,
                sold:x.owners.npc3?.sells,paid:x.paid,due:x.due,unpaid:x.unpaid,losses:x.losses.filter(z=>z.owner==="npc3").length,
                endShip:x.b7gMoneyFlow.days.at(-1).ship},
              closeouts:x.closeouts,followUpPurchases:x.followUpPurchases,
              snapshots:x.daily.filter(z=>[15,16,17,18,19,20,25,30,60,90].includes(z.day)),
              npc3:x.owners.npc3, tradePricesAtLastDay:x.b7gMoneyFlow.days.at(-1)?.quotes,
              autopilotState:x.b7fInvestment.stage
            }));
          '
      - name: B7i Vollkosten- und Minerreserve-Entscheidungsprobe mit demselben bezahlten NPC3-Frachter
        run: node tools/analyse-b7b-gemeinsame-konten.mjs --seed=42 --case=handel-flotte --mode=wallet --investment=npc3 --autotrade=on --fullcost=on --days=90 --b1="$RUNNER_TEMP/b7b-b1" --out="$RUNNER_TEMP/b7b-out"
      - name: B7i bezahlte Folgefahrten, Minimalkapital und Kern-Hashes gegen B7f/B7h testen
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";import assert from "node:assert/strict";
            const dir=process.env.RUNNER_TEMP+"/b7b-out/";
            const read=(v)=>JSON.parse(fs.readFileSync(dir+"b7"+v+"-handel-flotte-42-wallet-90d.json"));
            const f=read("f"),h=read("h"),i=read("i");
            assert.equal(f.final.hash,"23eb3796fb0b5ec3","B7f-Ref");
            assert.equal(h.final.hash,"6573a3c1acc3d5a5","B7h-Ref");
            assert.equal(i.days,90);assert.equal(i.hours,2160);assert.equal(i.daily.length,90);
            assert.equal(i.roundtrips,14);assert.equal(i.initialHash,h.initialHash);
            assert.equal(i.sourceSha256,h.sourceSha256);
            assert.notEqual(i.variantSha256,h.variantSha256,"nur isolierte Core-Entscheidung variiert");
            assert.deepEqual(i.daily.slice(0,15),h.daily.slice(0,15),"bis Tag15 genau gleicher Wirtschaftszustand");
            assert.equal(i.b7fInvestment.onceOnly,1);
            assert.equal(i.b7fInvestment.quantity,h.b7fInvestment.quantity);
            assert.equal(i.b7fInvestment.soldAt,h.b7fInvestment.soldAt);
            assert.equal(i.b7hAuto.activatedAt,h.b7hAuto.activatedAt);
            assert.equal(i.b7iGate.enabled,true);
            assert(i.b7iGate.choices.length>0,"tatsaechliche B7i-Einzelentscheidungen erfasst");
            const c=i.b7iGate.counts;
            assert(Object.values(c).reduce((a,b)=>a+b,0)>=i.b7iGate.choices.length,
              "bis zu 300 dokumentierte Entscheidungen, alle weiteren summarisch gezaehlt");
            for(const row of i.b7iGate.choices){
              if(row.quote){
                assert(row.quote.net>0);
                assert(row.quote.cashNeeded<=row.ownerCash);
                assert(row.quote.minerReserve>0);
              }
            }
            assert.equal(55000+i.final.minted-i.final.burned,50000,"Weltgeldbilanz unveraendert");
            const stat=(x)=>({hash:x.final.hash,npc3Cash:x.final.npc.npc3.cash,
              npc3Frachter:x.final.npc.npc3.freighters,npc3Miners:x.final.npc.npc3.miners,
              shortage:x.final.shortage,recipes:x.final.recipes,
              parts:x.consumerAudit.aggregate.bauteil,
              food:x.consumerAudit.aggregate.nahrung,meds:x.consumerAudit.aggregate.medikamente,
              consumerDays:x.consumerAudit.aggregate.daysWithConsumption,
              paid:x.paid,due:x.due,unpaid:x.unpaid,
              npc3Owner:x.owners.npc3,losses:x.losses.filter(z=>z.owner==="npc3").length,
              boughtHull:x.hulls.filter(z=>z.owner==="npc3"&&z.klasse==="frachter").length,
              tradeEvents:x.b7hAuto?.tradeEvents.length||0});
            const trades=i.b7hAuto.tradeEvents.filter(e=>e.tick>i.b7fInvestment.soldAt);
            console.log("B7I_VOLLKOSTEN_GELD",JSON.stringify({
              controls:{b7f:stat(f),b7h:stat(h)},experiment:stat(i),
              b7i:{counts:i.b7iGate.counts,firstChoices:i.b7iGate.choices.slice(0,32),
                lastChoices:i.b7iGate.choices.slice(-16)},
              nextTradeCounts:{buys:trades.filter(e=>e.kauf).length,
                sells:trades.filter(e=>!e.kauf).length},
              samples:trades.slice(0,20),lastTrade:trades.slice(-10),
              firstCashDays:i.daily.filter(x=>x.day>=15&&x.day<=30).map(x=>({
                day:x.day,cash:x.npc.npc3.cash,freighters:x.npc.npc3.freighters,
                shortage:x.shortage,production:x.recipes})),
              end:i.final
            }));
          '
      - name: 67 Standardtests
        run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b7b-shared-accounts-seed42
          path: ${{ runner.temp }}/b7b-out/*.json
