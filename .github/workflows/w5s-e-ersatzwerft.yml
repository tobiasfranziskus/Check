name: W5s-e – automatisch finanzierte Ersatzwerft
on:
  push:
    branches:
      - feature/w5s-e-bezahlte-ersatzwerft-automatik-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-e-ersatzwerft-automatik.test.mjs
      - .github/workflows/w5s-e-ersatzwerft.yml
jobs:
  automatische-ersatzwerft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-e-ersatzwerft-automatik.test.mjs
