name: W5s-ab-ac – echte Nachfolge-Fracht und Verschleiss
on:
  push:
    branches:
      - feature/w5s-ab-ac-folgefracht-verschleiss-20261107
  pull_request:
    paths:
      - index.html
      - tests/w5s-ab-ac-folgefracht-verschleiss.test.mjs
      - .github/workflows/w5s-ab-ac-folgefracht.yml
jobs:
  owner-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-ab-ac-folgefracht-verschleiss.test.mjs tests/w5s-aa-eigentum-kauf-flug.test.mjs tests/w5s-z-vorfinanzierte-folgewerft.test.mjs tests/w5s-y-engpass-und-finanzierungsgrenzen.test.mjs tests/w5s-x-nachfolger-erzfracht.test.mjs
      - run: node --test tests/*.test.mjs
