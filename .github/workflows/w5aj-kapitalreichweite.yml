name: W5aj – 13x90d fully paid finance reach and 365d crisis
on:
  pull_request:
    paths:
      - 'tests/w5aj-*'
      - 'docs/W5AJ_*'
      - '.github/workflows/w5aj-kapitalreichweite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capital-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5aj-kapitalreichweite.test.mjs
      - run: node --test tests/*.test.mjs
