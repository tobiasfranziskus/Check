name: "Kanonische Welt K1 – Node22, Wirtschaftsszenarien und Browser (Forschung)"
on:
  pull_request:
    paths:
      - 'prototypes/welt/**'
      - 'prototypes/flug2d/flug-kern.js'
      - 'prototypes/flug2d/grafik.js'
      - 'prototypes/w5ac/rule191-w5-ferry-core.js'
      - 'tools/welt-szenarien.mjs'
      - 'tools/k3-frachter-diagnose.mjs'
      - 'tools/k4-ore-allocation.mjs'
      - 'tests/k4-ore-allocation.test.mjs'
      - 'tools/referenzmodell-c.mjs'
      - 'tests/welt-*'
      - 'tests/referenzmodell-c.test.mjs'
      - 'index.html'
      - 'aphros-void.html'
      - '.github/workflows/welt-k1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kern-wirtschaft-speicher-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K1-Kern: Ortsbindung, Replay, Save/Load, Manipulationsabwehr"
        run: node --test tests/welt-kern.test.mjs
      - name: "K1-Spielstand: Umschlag, Plätze, Sicherungen, Import, Regel195-Übernahme"
        run: node --test tests/welt-speicher.test.mjs
      - name: "Referenzmodell C nachgerechnet und Abweichungen der ausgeführten Welt"
        run: node --test tests/referenzmodell-c.test.mjs
      - name: "K2: finanzierter Minerbau, Rückfracht, Ersatz, Save/Load"
        run: node --test tests/welt-k2-miner.test.mjs
      - name: "K2-QA: Zwischenstände, Treuhand, Manipulationsabwehr, Replay"
        run: node --test tests/welt-k2-zwischenzustand.test.mjs
      - name: "K3: unabhängige Frachterkette, Zwischenstände, Negativbeweis"
        run: |
          node --test tests/welt-k3-frachter.test.mjs
          node tools/k3-frachter-diagnose.mjs > "$RUNNER_TEMP/k3-diagnose.json"
          diff docs/K3_DIAGNOSE_SEED42.json "$RUNNER_TEMP/k3-diagnose.json"
      - name: "K4: zeitlich vorgezogene, vollständig finanzierte Original-Erzfracht"
        run: node --test tests/k4-ore-allocation.test.mjs
      - name: "K1-Wirtschaft: 15 Szenarien × 90 Tage, 365- und 730-Tage-Läufe"
        run: node --test tests/welt-wirtschaft.test.mjs
      - name: "Alle bestehenden Regel14-/Regel195-/Flug-Regressionen"
        run: node --test tests/*.test.mjs
      - name: "Einzeldatei-Build entspricht exakt der Kernquelle"
        run: node scripts/build-w5-singlefile.mjs --check
  browser-vier-groessen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Playwright nur als CI-Werkzeug, keine Laufzeitabhängigkeit des Spiels"
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/welt-playwright" playwright@1.62.0
          node "$RUNNER_TEMP/welt-playwright/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: "K1 im Browser: Touch, Kreislauf, IndexedDB-Autosave, Export/Import, Regel195-Übernahme"
        run: node tests/welt-browser.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/welt-playwright/node_modules/playwright
          WELT_BROWSER: ${{ matrix.browser }}
      - name: "Bildschirmfotos der vier Größen archivieren"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-k1-${{ matrix.browser }}
          path: /tmp/welt-k1-*.png
          if-no-files-found: warn
  k4-vergleich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "K4: 14 Tage Seed42/7, S12-Basis gegen Original-W3-Aufträge"
        run: |
          node tools/k4-ore-allocation.mjs 42 14 > "$RUNNER_TEMP/k4-seed42.json"
          node tools/k4-ore-allocation.mjs 7 14 > "$RUNNER_TEMP/k4-seed7.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const seed of [42, 7]) {
            const { basis, vorExport } = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/k4-seed' + seed + '.json', 'utf8'));
            for (const [modus, r] of [['basis', basis], ['vorExport', vorExport]]) {
              console.log('K4_RESULT ' + JSON.stringify({
                seed, modus, tick: r.tick, hash: r.hash,
                weltgeld: r.weltgeld, minted: r.minted, burned: r.burned,
                audit: r.audit, nullsaldo: r.nullsaldo,
                erz: r.erz, material: r.material, wasser: r.wasser,
                neueW3: r.manuelleW3Auftraege, quoteAblehnungen: r.quoteAblehnungen,
                frachterInsgesamt: r.frachter.length,
                frachterAktiv: r.frachter.filter(s => !s.stillgelegt).length,
              }));
            }
          }
          NODE
      - name: "K4: vollständige Seed42/7-Originaldaten archivieren"
        uses: actions/upload-artifact@v4
        with:
          name: k4-s12-14tage-seed42-7
          path: |
            ${{ runner.temp }}/k4-seed42.json
            ${{ runner.temp }}/k4-seed7.json
          if-no-files-found: error
