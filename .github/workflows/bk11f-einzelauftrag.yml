name: Aphros Void – B-K11f Einzelauftrag-Settlement (Analyse)
on:
  pull_request:
    paths:
      - 'tools/bk11f-vertragsbilanz.mjs'
      - 'tests/bk11f-auftrag-kapital.test.mjs'
      - 'docs/ANALYSE_BK11F_EINZELAUFTRAG.md'
      - '.github/workflows/bk11f-einzelauftrag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beleg-und-geld-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: B-K11f formales Original-Beleg-Escrow, keine Produktregel
        run: node --test tests/bk11f-auftrag-kapital.test.mjs
      - name: Isolierter auditierter Vertragsreport
        run: node tools/bk11f-vertragsbilanz.mjs
