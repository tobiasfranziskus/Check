name: "W6/P8d – 13x90 and S02x365 paid two-owner freight economy"
on:
  pull_request:
    paths:
      - 'prototypes/welt/p8d-dravos-fracht-core.js'
      - 'prototypes/welt/welt-kern.js'
      - 'prototypes/welt/j2b-silizium-core.js'
      - 'prototypes/welt/rule200-k7-industry-core.js'
      - 'prototypes/welt/j3-bauteil-core.js'
      - 'prototypes/welt/j4b-jaeger-werft-core.js'
      - 'tools/w6-p8d-dravos-szenarien.cjs'
      - 'tests/w6-p8f-originalbefehle-ohne-werft.test.mjs'
      - '.github/workflows/w6-p8d-dravos-economy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regime:
    name: "${{ matrix.scenario }} – ${{ matrix.days }} days"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: S01, days: 90}
          - {scenario: S02, days: 90}
          - {scenario: S03, days: 90}
          - {scenario: S04, days: 90}
          - {scenario: S05, days: 90}
          - {scenario: S06, days: 90}
          - {scenario: S07, days: 90}
          - {scenario: S08, days: 90}
          - {scenario: S09, days: 90}
          - {scenario: S10, days: 90}
          - {scenario: S11, days: 90}
          - {scenario: S12, days: 90}
          - {scenario: S13, days: 90}
          - {scenario: S02, days: 365}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Original booked silicon/freight, money, stock, save and ownership audit"
        env:
          P8D_OUTPUT_JSON: "p8d-${{ matrix.scenario }}-${{ matrix.days }}.json"
        run: |
          node --check tools/w6-p8d-dravos-szenarien.cjs
          node tools/w6-p8d-dravos-szenarien.cjs "${{ matrix.scenario }}" "${{ matrix.days }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: "p8d-${{ matrix.scenario }}-${{ matrix.days }}"
          path: "p8d-${{ matrix.scenario }}-${{ matrix.days }}.json"
          retention-days: 30
  aggregate:
    needs: regime
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        if: needs.regime.result == 'success'
        with:
          pattern: p8d-*
          merge-multiple: true
      - name: "P8f isolated original-command counterfactuals (no rule change)"
        run: node --test tests/w6-p8f-originalbefehle-ohne-werft.test.mjs
      - name: "Independent 13x90 + S02x365 summary; failures not passed"
        env:
          REGIME_STATUS: "${{ needs.regime.result }}"
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          assert.equal(process.env.REGIME_STATUS,'success','At least one crisis scenario failed');
          const entries=fs.readdirSync('.').filter(x=>/^p8d-S\d\d-(90|365)\.json$/.test(x));
          assert.equal(entries.length,14,'all 13x90 and S02x365 JSONs required');
          const rows=entries.map(x=>JSON.parse(fs.readFileSync(x,'utf8')).results[0]);
          const short=rows.filter(x=>x.days===90);
          assert.equal(new Set(short.map(x=>x.id)).size,13);
          assert.equal(rows.filter(x=>x.days===365&&x.id==='S02').length,1);
          assert.ok(rows.every(x=>x.worldISK===33000&&x.mint===0&&x.burn===0));
          // A green financial audit does not mean a working 365-day economy.
          // Check activity against the ACTUAL last 30 days of every run.
          for(const x of rows){
            assert.equal(x.last30Window?.startDay,x.days-30);
            assert.equal(x.last30Window?.endDay,x.days);
            const w=x.last30Window;
            assert.deepEqual(x.last30Active,{
              ice:w.end.ice>w.start.ice,
              water:w.end.waterISK>w.start.waterISK,
              replacement:w.end.replacements>w.start.replacements
            });
          }
          console.log('P8D_FINAL_30_DAY_ACTIVITY',JSON.stringify(rows.map(x=>({
            id:x.id,days:x.days,fromDay:x.last30Window.startDay,
            toDay:x.last30Window.endDay,active:x.last30Active,
            contracts:x.contracts
          }))));
          console.log('P8D_ALL_ECONOMY_REGIMES',JSON.stringify(rows.map(x=>({
            id:x.id,days:x.days,contracts:x.contracts,dravo:x.siliconDravosSold,
            fee:x.feeISK,pilot:x.pilotISK,carrier:x.carrierCash,npc3:x.npc3Cash,
            capacity:x.carrierCapacity,hash:x.hash
          }))));
          NODE
