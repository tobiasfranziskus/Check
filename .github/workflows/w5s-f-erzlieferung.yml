name: W5s-f – bezahlte automatische Erz-Nachlieferung
on:
  push:
    branches:
      - feature/w5s-f-vorfinanzierte-erznachlieferung-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-f-erznachlieferung.test.mjs
      - .github/workflows/w5s-f-erzlieferung.yml
jobs:
  finanzierte-erzlieferung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-f-erznachlieferung.test.mjs
