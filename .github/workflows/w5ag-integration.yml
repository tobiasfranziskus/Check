name: W5ag – Rule195 browser integration and paid ice-water flow
on:
  pull_request:
    paths:
      - 'prototypes/w5ag/**'
      - 'prototypes/w5ac/**'
      - 'prototypes/w5ab/extension.js'
      - 'prototypes/w5aa/extension.js'
      - 'prototypes/w5y/extension.js'
      - 'prototypes/w5w/app.js'
      - 'prototypes/legacy-hub/core-adapter.js'
      - 'tests/w5ag*.test.mjs'
      - 'tests/w5ag-touch.py'
      - 'tests/w5ak*'
      - 'docs/W5AK_*'
      - 'tests/ui-miner2d*'
      - 'docs/W5AG_*'
      - 'docs/UI_MINER2D_RULE195.md'
      - '.github/workflows/w5ag-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-core-private-salaries-and-all-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete Node22 regression including Rule195 wages, replay and browser session
        run: node --test tests/*.test.mjs
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: "Four touch sizes: paid W0-W5, ice, water, two private buyers and protected imports"
        run: python tests/w5ag-touch.py
        env:
          CHROMIUM_PATH: playwright-managed
      - name: Core-bound Miner2D cockpit in four touch sizes
        run: python tests/ui-miner2d-touch.py
        env:
          CHROMIUM_PATH: playwright-managed
      - name: W5ak second real payroll cycle in four touch sizes
        run: python tests/w5ak-touch.py
        env:
          CHROMIUM_PATH: playwright-managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5ag-touch-evidence
          path: |
            /tmp/w5ag-*.png
            /tmp/w5ak-*.png
            /tmp/ui-miner2d-*.png
