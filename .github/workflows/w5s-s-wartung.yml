name: W5s-s – bedarfsgebundene Wasserwerkswartung
on:
  push:
    branches:
      - feature/w5s-s-nachfragegebundene-wartung-20261106
  pull_request:
    paths:
      - index.html
      - tests/w5s-s-nachfrage-wartung.test.mjs
      - .github/workflows/w5s-s-wartung.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5s-s-nachfrage-wartung.test.mjs
