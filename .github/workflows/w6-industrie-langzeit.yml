name: W6 Industrie – unveränderte Rule204 Langzeitprüfung
on:
  pull_request:
    paths:
      - tools/w6-industrie-langzeit.cjs
      - tests/industrie/**
      - tests/fixtures/w6-industrie/**
      - .github/workflows/w6-industrie-langzeit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  industrie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 13×90, S02×365/730, unabhängige Audits und Replay
        env:
          W6_PROGRESS: '1'
        run: |
          set -o pipefail
          node --version | tee node-version.txt
          node --test tests/industrie/*.test.mjs | tee w6-industrie.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w6-industrie-node22
          path: |
            node-version.txt
            w6-industrie.tap
            tests/fixtures/w6-industrie/reference.json
