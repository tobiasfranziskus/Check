name: W5ai – second fully prepaid ice freight and new private pilot wages
on:
  pull_request:
    paths:
      - 'prototypes/w5ah/**'
      - 'tests/w5ai-*'
      - 'docs/W5AI_*'
      - '.github/workflows/w5ai-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-second-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/w5ai-zweiter-lohnzyklus.test.mjs
  second-paid-payroll-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/w5ai-touch.py
